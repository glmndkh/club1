async function gmailConnect(){if(!isOwner())return;gmailReadForm();if(location.protocol==='file:')return toast('Gmail холбохын тулд апп-ыг вэб хаягаар (https://… эсвэл http://localhost) нээнэ үү.');if(!/\.apps\.googleusercontent\.com$/.test(gmail.clientId))return toast('Google OAuth Client ID-гаа оруулна уу (…apps.googleusercontent.com).');if(!clubAccounts().length)return toast('Клубийн дансны дугаараа оруулна уу.');try{await loadGis()}catch(e){return toast(e.message)}const tc=google.accounts.oauth2.initTokenClient({client_id:gmail.clientId,scope:'https://www.googleapis.com/auth/gmail.readonly',hint:gmail.email||undefined,callback:async r=>{if(!r||r.error||!r.access_token){gmail.error='Google нэвтрэлт амжилтгүй: '+(r&&(r.error_description||r.error)||'');render();return toast(gmail.error)}gmail.token=r.access_token;gmail.exp=Date.now()+(Number(r.expires_in)||3600)*1000;gmail.error='';try{gmail.email=(await gapi('profile')).emailAddress||gmail.email}catch(e){}gmailSaveCfg();aud('Gmail холбогдлоо: '+gmail.email);render();toast('Gmail холбогдлоо: '+gmail.email);gmailScan(true)},error_callback:e=>toast('Google нэвтрэлт цуцлагдлаа'+(e&&e.type?' ('+e.type+')':''))});tc.requestAccessToken({prompt:gmail.email?'':'consent'})}
async function gmailScan(manual=false){if(!gmailOn()){if(manual)toast('Gmail холбогдоогүй эсвэл нэвтрэлтийн хугацаа дууссан. "Gmail холбох" товчийг дарна уу.');return 0}if(gmail.busy)return 0;gmail.busy=true;try{const q=`from:(${VZ_BANKS.flatMap(b=>b.domains).join(' OR ')}) newer_than:14d`;const list=await gapi('messages',{q,maxResults:'50'});data.gmailSeen||=[];const seen=new Set(data.gmailSeen);const rows=[];let changed=false;for(const m of list.messages||[]){if(seen.has(m.id))continue;const msg=await gapi('messages/'+m.id,{format:'full'});seen.add(m.id);data.gmailSeen.push(m.id);changed=true;const row=vzBankRowFromGmail(msg);if(row)rows.push(row)}data.gmailSeen=data.gmailSeen.slice(-1000);gmail.lastScan=Date.now();gmail.error='';const n=await importBankRows(rows,false);if(!n){if(changed)store();if(manual)toast('Шинэ орлогын гүйлгээ олдсонгүй.')}if(!n&&isOwner()&&ui.view==='settings')render();return n}catch(e){gmail.error=e.message;if(manual||!gmailOn())toast(e.message);return 0}finally{gmail.busy=false}}
setInterval(()=>gmailScan(false),5*60000);
function gmailScanNow(){gmailReadForm();return gmailScan(true)}
function gmailDisconnect(){if(!confirm('Gmail-ийг салгах уу? Бүртгэгдсэн төлбөрүүд хэвээр үлдэнэ.'))return;try{if(gmail.token&&window.google?.accounts?.oauth2)google.accounts.oauth2.revoke(gmail.token,()=>{})}catch(e){}gmail.token='';gmail.exp=0;gmail.email='';gmail.error='';gmailSaveCfg();render();toast('Gmail салгагдлаа.')}
function gmailCard(){const on=gmailOn();const fileMode=location.protocol==='file:';return `<section class="card vzx-cloud" aria-labelledby="vzx-gm-t"><div class="between"><div><h3 id="vzx-gm-t">Gmail холболт: банкны төлбөр автоматаар унших</h3><p class="muted small">Клубийн Gmail-ийг холбоход банкнаас ирсэн орлогын мэйлийг уншиж, гишүүний төлбөрийг автоматаар бүртгэнэ. Зөвхөн унших эрх авна, мэйл илгээх, устгахгүй.</p></div>${on?tag('Холбогдсон','green'):gmail.email?tag('Дахин нэвтрэх','amber'):tag('Холбогдоогүй','amber')}</div>${fileMode?`<div class="notice warn" style="margin-top:12px">Апп файлаар шууд нээгдсэн байна. Google нэвтрэлт ажиллахын тулд апп-ыг вэб хаягаар (https://… эсвэл http://localhost) нээнэ үү. Заавар: ЗААВАР.md</div>`:''}<div class="form-grid" style="margin-top:16px">${field('gm-client','Google OAuth Client ID',gmail.clientId,'text','placeholder="…apps.googleusercontent.com" autocomplete="off" spellcheck="false"')}${field('gm-accounts','Клубийн дансны дугаар (олон бол таслалаар)',club().bankAccounts||'','text','placeholder="Жишээ нь: 5000111222" autocomplete="off" inputmode="numeric"')}</div>${gmail.email?`<p class="small" style="margin-top:12px">${on?'Холбогдсон':'Сүүлд холбогдсон'}: <strong>${esc(gmail.email)}</strong>${gmail.lastScan?` · Сүүлд шалгасан: ${esc(new Date(gmail.lastScan).toLocaleTimeString())}`:''}${on?' · 5 минут тутам шалгана':''}</p>`:''}${gmail.error?`<div class="notice bad" style="margin-top:12px">${esc(gmail.error)}</div>`:''}<div class="vzx-actions" style="margin-top:16px"><button class="btn primary" onclick="app.gmailConnect()">${ico('mail')} ${on?'Өөр Gmail холбох':'Gmail холбох'}</button>${on?`<button class="btn outline" onclick="app.gmailScanNow()">Одоо шалгах</button><button class="btn outline" onclick="app.gmailDisconnect()">Салгах</button>`:''}</div></section>`}
function serverGmailCard(){const m=cloud.mail||{};return `<section class="card vzx-cloud" aria-labelledby="vzx-sg-t"><div class="between"><div><h3 id="vzx-sg-t">Gmail холболт: сервер 24 цаг уншина</h3><p class="muted small">Сервер клубийн Gmail-ийг ${m.scanMinutes||5} минут тутам уншиж, банкнаас ирсэн орлогыг бүртгэнэ. Апп хаалттай байсан ч ажиллана. Зөвхөн уншина, юу ч өөрчлөхгүй.</p><p class="small" style="margin-top:6px">App Password авах: <a href="https://myaccount.google.com/apppasswords" target="_blank" rel="noopener">myaccount.google.com/apppasswords</a>. Gmail-ийн 2 шаттай баталгаажуулалт асаалттай байх ёстой.</p></div>${m.configured?(m.error?tag('Алдаатай','red'):tag('Холбогдсон','green')):tag('Холбогдоогүй','amber')}</div><div class="form-grid" style="margin-top:16px">${field('sg-user','Gmail хаяг',m.user||'','email','placeholder="club@gmail.com" autocomplete="off"')}${field('sg-pass','App Password (16 тэмдэгт)','','password',`placeholder="${m.configured?'Өөрчлөхгүй бол хоосон үлдээнэ':'xxxx xxxx xxxx xxxx'}" autocomplete="new-password"`)}${field('gm-accounts','Клубийн дансны дугаар (олон бол таслалаар)',club().bankAccounts||'','text','placeholder="Жишээ нь: 5000111222" autocomplete="off" inputmode="numeric"')}</div>${m.configured?`<p class="small" style="margin-top:12px">Холбогдсон: <strong>${esc(m.user)}</strong>${m.lastOk?` · Сүүлд амжилттай шалгасан: ${esc(new Date(m.lastOk).toLocaleString())}`:''}${m.suspicious?` · <span style="color:#A1231B;font-weight:600">Баталгаагүй ${m.suspicious} мэйл</span>`:''}</p>`:''}${mailReport(m)}${m.error?`<div class="notice bad" style="margin-top:12px">${esc(m.error)}</div>`:''}<div class="vzx-actions" style="margin-top:16px"><button class="btn primary" onclick="app.serverGmailSave()">${ico('mail')} ${m.configured?'Хадгалах':'Gmail холбох'}</button>${m.configured?`<button class="btn outline" onclick="app.cloudScanNow()">Одоо шалгах</button><button class="btn outline" onclick="app.serverGmailRescan()">14 хоногийг дахин ш async function serverGmailSave(){const user=($('sg-user')?.value||'').trim(),pass=($('sg-pass')?.value||'').trim(),acc=($('gm-accounts')?.value||'').trim();if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(user))return toast('Gmail хаягаа зөв оруулна уу.');if(!acc)return toast('Клубийн дансны дугаараа оруулна уу.');if(club().bankAccounts!==acc){club().bankAccounts=acc;aud('Клубийн дансны дугаар шинэчлэгдлээ');localSet();clearTimeout(cloudTimer);try{await cloudSave()}catch(e){return toast('Хадгалж чадсангүй: '+e.message)}}toast('Gmail-тэй холбогдож байна…');try{const j=await cloudReq('gmailSave',{user,pass},true);cloud.mail=j.mail;const n=await importBankRows(j.inbox||[]);if(!n){render();toast('Gmail холбогдлоо: '+user+(j.mail&&j.mail.error?' · '+j.mail.error:''))}}catch(e){toast(e.message)}}
async function serverGmailRemove(){if(!confirm('Сервер дээрх Gmail холболтыг салгах уу? Бүртгэгдсэн төлбөрүүд хэвээр үлдэнэ.'))return;try{const j=await cloudReq('gmailRemove',{},true);cloud.mail=j.mail;render();toast('Gmail салгагдлаа.')}catch(e){toast(e.message)}}

async function doSetup(){const v=id=>($(id)?.value||'').trim();const c={name:v('su-club'),phone:v('su-phone'),location:v('su-location'),email:v('su-cemail')};const o={name:v('su-name'),email:v('su-email'),password:$('su-pass')?.value||''};if(!c.name)return toast('Клубийн нэрээ оруулна уу.');if(!o.name||!o.email)return toast('Нэр, имэйлээ оруулна уу.');if(o.password.length<8)return toast('Нууц үг дор хаяж 8 тэмдэгт байна.');if(o.password!==($('su-pass2')?.value||''))return toast('Нууц үг таарахгүй байна.');const state=freshClubState(c);try{const j=await cloudReq('setup',{owner:o,state},true);cloud.token=j.token;cloud.server='vz';cloud.setupNeeded=false;cloudSaveCfg();data=state;cloud.rev=j.rev;cloud.appsRev=j.appsRev;cloud.ready=true;cloud.lastSync=Date.now();localSet();applyUser(j.user);ui.view='settings';render();toast('Клуб үүслээ. Тавтай морил, '+j.user.name+'!')}catch(e){toast(e.message)}}
function serverLoginPage(){return `<div class="login-bg"><form class="login-card vzx-auth vzx-auth-sm" onsubmit="event.preventDefault();app.doLogin()"><div class="login-top"><div class="brand"><img class="brand-logo" src="${VZ_LOGO}" alt="">VOLLEYBALL <b>ZONE</b></div><h2>Ажилтны нэвтрэлт</h2><p style="margin-top:8px;color:#D9CFF0">Клубийн эзэн, менежер, дасгалжуулагч нэвтэрнэ.</p></div><div class="login-body">${field('login-email','Имэйл','','email','required autocomplete="username"')}${field('login-pass','Нууц үг','','password','required autocomplete="current-password"')}<button class="btn primary lg block" type="submit" style="margin-top:8px">Нэвтрэх</button><div class="between" style="margin-top:16px;gap:12px;flex-wrap:wrap"><button type="button" class="vzx-link dark" onclick="app.goPublic()">${ico('back')} Нүүр хуудас</button><span class="small muted">Нууц үгээ мартсан бол клубийн эзэнд хандана уу.</span></div></div></form></div>`}

function openStaffForm(id){const u=id?(cloud.users||[]).find(x=>x.id===id):null;showModal(u?'Ажилтан засах':'Ажилтан нэмэх',`<div class="form-grid">${field('st-name','Нэр',u?.name||'','text','required maxlength="90"')}${field('st-phone','Утас',u?.phone||'','tel','maxlength="30"')}${field('st-email','Нэвтрэх имэйл',u?.email||'','email','required autocomplete="off"')}${choose('st-role','Үүрэг',[['coach','Дасгалжуулагч'],['manager','Менежер'],['owner','Клубийн эзэн']],u?.role||'coach')}${field('st-pass',u?'Шинэ нууц үг (солихгүй бол хоосон)':'Түр нууц үг (8+ тэмдэгт)','','text','autocomplete="off" minlength="8"')}</div><p class="small muted" style="margin-top:12px">Дасгалжуулагч нэмэхэд тэр хичээлийн хуваарь дээр дасгалжуулагчаар сонгогдох боломжтой болно.</p>`,`<button class="btn outline" onclick="app.closeModal()">Болих</button><button class="btn primary" onclick="app.saveStaff('${u?esc(u.id):''}')">${u?'Хадгалах':'Нэмэх'}</button>`)}
async function saveStaff(id){const v=k=>($(k)?.value||'').trim();const f={name:v('st-name'),phone:v('st-phone'),email:v('st-email'),role:v('st-role'),password:$('st-pass')?.value||''};if(!f.name||!f.email)return toast('Нэр, имэйлээ оруулна уу.');if(!id&&f.password.length<8)return toast('Түр нууц үг дор хаяж 8 тэмдэгт байна.');const u=id?(cloud.users||[]).find(x=>x.id===id):null;let coachId=u?.coachId||'';if(f.role==='coach'&&!(coachId&&coachOf(coachId)))coachId=uid('coach');try{const j=await cloudReq(id?'userUpdate':'userCreate',{id:id||undefined,...f,password:f.password||undefined,coachId},true);cloud.users=j.users;if(f.role==='coach'){const c=coachOf(coachId);if(c){c.name=f.name;c.phone=f.phone}else data.coaches.push({id:coachId,clubId:data.clubId,name:f.name,phone:f.phone});aud(`Дасгалжуулагч: ${f.name}`);store()}closeModal();render();toast(id?'Хадгаллаа.':`${f.name} нэмэгдлээ. Нэвтрэх имэйл: ${f.email}`)}catch(e){toast(e.message)}}

 function translate(value){
   const raw=String(value??''),s=raw.trim();if(!s||!/[A-Za-z]/.test(s))return raw;
   const protectedValues=[];
   const tokenized=s.replace(/[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}/gi,(val)=>{protectedValues.push(val);return '§§'+(protectedValues.length-1)+'§§'});
   let out=EXACT[s]??DEFAULTS[s];
   if(out===undefined){out=tokenized;for(const [from,to] of PARTS){if(from&&out.includes(from))out=out.split(from).join(to)}}
   for(const [re,repl] of specialPatterns)out=out.replace(re,repl);
   out=out.replace(/§§(\d+)§§/g,(_,n)=>protectedValues[+n]??'');
   if(out===s)return raw;
   return raw.replace(s,out);
 }
