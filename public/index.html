.vzx-facts dd{margin:0;font-family:Montserrat,sans-serif;font-size:26px;font-weight:800;color:#FFC61F}
.vzx-facts dt{font-size:14px;color:#C9BDE6}
.vzx-hero-media{flex:1 1 400px;min-width:0}
.vzx-hero-media img{display:block;width:100%;height:auto;aspect-ratio:1/1;max-height:520px;object-fit:cover;object-position:93% 40%;border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.vzx-section{padding:88px 0 40px}

.vzx-chips{display:flex;gap:8px;flex-wrap:wrap}
.vzx-chip{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #D9D0EA;background:#fff;color:var(--ink);font-weight:600;font-size:14px;cursor:pointer}

.vzx-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:24px}
.vzx-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:22px}
.vzx-card-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.vzx-tag{padding:6px 12px;border-radius:999px;background:#F3EEFC;color:#4B1FA0;font-size:13px;font-weight:600}
.vzx-tag.gold{background:#FFF4D1;color:#7A5200}
.vzx-level{display:flex;align-items:flex-end;gap:3px;height:16px}
.vzx-level i{width:5px;border-radius:2px;background:#E1D8F2}
.vzx-level i:nth-child(1){height:6px}.vzx-level i:nth-child(2){height:11px}.vzx-level i:nth-child(3){height:16px}
.vzx-level i.on{background:#5B2DB8}
.vzx-card h3{font-size:22px;line-height:1.25;font-weight:700;margin:0 0 6px}
.vzx-muted{color:var(--muted);font-size:15px;margin:0}
.vzx-days{display:flex;gap:6px}
.vzx-days span{flex:1 1 0;min-width:0;max-width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#F3F0F8;color:#7D7490;font-size:13px;font-weight:600}
.vzx-days span.on{background:#1B0B45;color:#fff}
.vzx-sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.vzx-meta{display:flex;gap:24px;flex-wrap:wrap;font-size:15px}
.vzx-meta span{display:inline-flex;align-items:center;gap:8px}.vzx-meta .vzi{color:#5B2DB8}
.vzx-meta strong{font-weight:600}
.vzx-card .btn{margin-top:auto}
.vzx-pricing{margin-top:24px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding:24px 28px;background:#fff;border:1px solid var(--line);border-radius:20px}
.vzx-pricing>div:first-child{display:flex;flex-direction:column;gap:4px}

.vzx-prices div{display:flex;flex-direction:column-reverse;gap:2px}

.vzx-steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:24px}
.vzx-steps li{display:flex;flex-direction:column;gap:12px;padding-top:24px;border-top:3px solid #1B0B45}
.vzx-steps li:last-child{border-top-color:#FFC61F}
.vzx-steps .n{font-family:Montserrat,sans-serif;font-size:15px;font-weight:800;color:#5B2DB8}
.vzx-steps li:last-child .n{color:#7A5200}
.vzx-steps h3{font-size:20px;margin:0}
.vzx-steps p{font-size:16px;color:var(--muted);margin:0}
.vzx-cta{margin:72px 0 88px;padding:48px;border-radius:28px;background:#4B1FA0;color:#fff;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:28px}

.vzx-footer{background:#1B0B45;color:#fff;padding:64px 0 32px}
.vzx-footer-grid{display:flex;flex-wrap:wrap;gap:48px;justify-content:space-between}

.vzx-soc{display:flex;flex-wrap:wrap;gap:8px}

.vzx-contact dd{margin:0;font-size:15px}.vzx-contact a{color:#fff}
.vzx-footer-bottom{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:40px;padding-top:24px;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#A99CCB}
.vzx-footer-bottom button{background:none;border:0;color:#FFD95C;text-decoration:underline;font-size:14px;cursor:pointer;min-height:44px}
/* registration */
.vz-register-page.vzx{background:#F7F5FB;padding-bottom:80px}
.vzx-reghead{background:#fff;border-bottom:1px solid var(--line)}
.vzx-reghead .vzx-header-in{min-height:68px}
.vzx-reghead .vzx-logo{width:40px;height:40px}
.vzx-reg{padding-top:40px;display:flex;flex-direction:column;gap:28px}
.vzx-reg-title h1{font-size:clamp(26px,3.4vw,34px);font-weight:800;letter-spacing:-.6px;margin:0 0 8px}
.vzx-reg-title p{color:var(--muted);font-size:16px;margin:0}
.vzx-stepper{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.vzx-stepper li{display:flex;flex-direction:column;gap:10px}
.vzx-stepper .bar{height:4px;border-radius:2px;background:#E1D8F2}
.vzx-stepper li.done .bar,.vzx-stepper li.current .bar{background:#4B1FA0}
.vzx-stepper .lbl{display:flex;align-items:center;min-height:32px;gap:6px;font-size:14px;font-weight:500;color:var(--hint)}
.vzx-stepper li.current .lbl{color:var(--ink);font-weight:700}
.vzx-stepper li.done .lbl{color:#4B1FA0;font-weight:600}
.vzx-stepper button{background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left;min-height:32px}
.vzx-stepper button:hover{text-decoration:underline}
.vzx-reg-narrow{max-width:820px}
.vzx-reg-grid{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.vzx-reg-main{flex:999 1 560px;min-width:0}
.vzx-aside{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
.vzx-panel,.vzx-fs{background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;margin:0 0 24px;min-width:0}
.vzx-panel h2{font-size:22px;margin:0 0 8px}
.vzx-fs legend{float:left;width:100%;padding:0;margin-bottom:20px;font-family:Montserrat,sans-serif;font-size:19px;font-weight:700;color:var(--ink)}
.vzx-fs>*:not(legend){clear:both}
.vzx-fs-desc{color:var(--muted);margin:-12px 0 20px;font-size:15px}
.vzx-hint{font-size:13px;color:var(--hint)}
.vzx-tel{display:flex;min-height:48px;border:1px solid #CFC5E2;border-radius:10px;overflow:hidden;background:#fff}
.vzx-tel:focus-within{border-color:#4B1FA0;box-shadow:0 0 0 3px rgba(75,31,160,.15)}
.vzx-tel:has(input:user-invalid){border:2px solid #B3261E}
.vzx-tel>span{display:grid;place-items:center;padding:0 12px;background:#F7F5FB;border-right:1px solid var(--line);color:var(--muted);font-size:15px}
.field .vzx-tel input{flex:1;min-width:0;border:0!important;box-shadow:none!important;border-radius:0!important;min-height:46px}
.field .vzx-tel input:focus-visible{outline:none!important}
.vzx-pills{display:flex;flex-wrap:wrap;gap:8px}
.vzx-pills label{position:relative;display:inline-flex}
.vzx-pills input{position:absolute;opacity:0;width:1px;height:1px}
.vzx-pills span{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid #CFC5E2;font-size:15px;font-weight:500;cursor:pointer;background:#fff}
.vzx-pills input:checked+span{border:2px solid #4B1FA0;background:#F3EEFC;color:#4B1FA0;font-weight:600;padding:0 17px}
.vzx-pills input:focus-visible+span{outline:3px solid #B49BEA;outline-offset:2px}
.vzx-classpick{display:flex;flex-direction:column;gap:12px}
.vzx-classopt{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:14px;border:1px solid var(--line);cursor:pointer;background:#fff}
.vzx-classopt:has(input:checked){border:2px solid #4B1FA0;background:#F8F5FE;padding:17px 19px}
.vzx-classopt input{width:20px;height:20px;accent-color:#4B1FA0;margin:0;flex:none}
.vzx-classopt>span{display:flex;flex-direction:column;gap:4px}
.vzx-classopt strong{font-size:16px}
.vzx-classopt small{font-size:14px;color:var(--muted)}
.vzx-form-actions{display:flex;flex-wrap:wrap-reverse;justify-content:space-between;align-items:center;gap:12px}
.vzx-sumcard{background:#1B0B45;color:#fff;border-radius:20px;padding:24px;display:flex;flex-direction:column;gap:16px}
.vzx-sumcard .k{font-size:12.5px;font-weight:600;letter-spacing:1px;color:#C9BDE6}
.vzx-sumcard .t{font-family:Montserrat,sans-serif;font-size:20px;font-weight:700;display:block}
.vzx-sumcard .s{font-size:14px;color:#C9BDE6;display:block;margin-top:4px}
.vzx-sumcard dl{margin:0;display:flex;flex-direction:column;gap:10px;font-size:15px}
.vzx-sumcard dl div{display:flex;justify-content:space-between;gap:12px}
.vzx-sumcard dt{color:#C9BDE6}.vzx-sumcard dd{margin:0;font-weight:600;text-align:right}
.vzx-sumcard hr{border:0;height:1px;background:rgba(255,255,255,.14);margin:0}
.vzx-sumcard .next{display:flex;gap:12px;align-items:flex-start}
.vzx-sumcard .next b{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#FFC61F;color:#1B0B45;font-size:13px}
.vzx-sumcard .next p{margin:0;font-size:14px;line-height:1.55;color:#E4DCF7}
.vzx-privacy,.vzx-note{display:flex;gap:12px;padding:18px;border-radius:16px;background:#fff;border:1px solid var(--line);font-size:14px;line-height:1.55;color:var(--muted)}
.vzx-privacy p,.vzx-note p{margin:0}
.vzx-privacy .vzi{color:#5B2DB8;margin-top:2px}
.vzx-note{background:#FFF8E6;border-color:#F5DD9A;color:#5C3E00;margin-bottom:20px}
.vzx-note .vzi{color:#7A5200;margin-top:2px}
.vzx-consent{margin-bottom:24px;font-size:15px}
.vzx-choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-top:20px}
.vzx-choice{display:flex;flex-direction:column;gap:10px;text-align:left;padding:24px;border-radius:16px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;min-height:170px;font:inherit;white-space:normal}
.vzx-choice:hover{border-color:#4B1FA0;background:#F8F5FE}
.vzx-choice-ico{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:#F3EEFC;color:#4B1FA0}
.vzx-choice strong{font-size:18px;font-family:Montserrat,sans-serif}
.vzx-choice span:last-child{color:var(--muted);font-size:14.5px}
.vzx-review{margin:0 0 8px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.vzx-review div{display:flex;flex-direction:column;gap:2px}
.vzx-review dt{font-size:13px;color:var(--hint)}.vzx-review dd{margin:0;font-weight:600}
.vz-slot{min-height:56px;border-color:var(--line);background:#fff;border-radius:12px;padding:14px}
.vz-slot:has(input:checked){border-color:#4B1FA0;background:#F8F5FE;box-shadow:0 0 0 1px #4B1FA0}
.vz-slot input{accent-color:#4B1FA0;width:20px;height:20px}
/* dashboard */
.vzx-dash{display:flex;flex-direction:column;gap:28px}
.vzx-dash-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.vzx-dash-head h1{font-size:30px;font-weight:800;letter-spacing:-.5px;margin:4px 0 0}
.vzx-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.vzx-kpi{padding:20px;border-radius:16px;background:#fff;border:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.vzx-kpi .l{font-size:14px;font-weight:500;color:var(--muted)}
.vzx-kpi .v{font-family:Montserrat,sans-serif;font-size:28px;font-weight:800;letter-spacing:-.5px;color:var(--ink)}
.vzx-kpi .f{font-size:13px;color:var(--hint)}
.vzx-kpi.warn{background:#FFF8E6;border-color:#F5DD9A}.vzx-kpi.warn .l,.vzx-kpi.warn .f{color:#7A5200;font-weight:600}
.vzx-dash-grid{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.vzx-att{flex:999 1 520px;min-width:0}
.vzx-side{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:24px}
.vzx-box{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden}

.vzx-box-head h2{font-size:18px;font-weight:700;margin:0}
.vzx-table-wrap{overflow-x:auto}
.vzx-table{width:100%;min-width:560px;border-collapse:collapse;font-size:15px}
.vzx-table th{text-align:left;padding:12px 24px;font-size:13px;font-weight:600;color:var(--hint)}
.vzx-table td{padding:14px 24px;border-top:1px solid #EFEAF6;vertical-align:middle}
.vzx-table .r{text-align:right}
.vzx-person{display:flex;align-items:center;gap:12px}
.vzx-person>span:last-child{display:flex;flex-direction:column;gap:2px}
.vzx-person small{font-size:13px;color:var(--hint)}
.vzx-av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:#F3EEFC;color:#4B1FA0;font-size:13px;font-weight:700}
.vzx-badge{display:inline-flex;padding:4px 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.vzx-badge.bad{background:#FDE8E7;color:#A1231B}.vzx-badge.warn{background:#FFF4D1;color:#7A5200}
.vzx-row-actions{display:inline-flex;gap:8px}
.vzx-sessions{display:flex;flex-direction:column;padding:12px}
.vzx-sess{display:flex;align-items:center;gap:14px;padding:12px;border-radius:12px}
.vzx-box>.vzx-sess{margin:8px 12px}
.vzx-sess.today{background:#1B0B45;color:#fff}
.vzx-sess .when{flex:none;width:68px;display:flex;flex-direction:column;gap:2px}
.vzx-sess .when span{font-size:12px;font-weight:600;color:var(--hint);text-transform:uppercase}
.vzx-sess.today .when span{color:#FFC61F}
.vzx-sess .what{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.vzx-sess .what small{font-size:13px;color:var(--hint)}
.vzx-sess.today .what small{color:#C9BDE6}
.vzx-empty{display:flex;align-items:center;gap:12px;padding:20px 24px;color:var(--muted)}
.vzx-empty p{margin:0}
.vzx-empty .vzi{box-sizing:border-box;width:36px;height:36px;padding:8px;border-radius:50%;background:#E3F5EC;color:#11795A}
@media (max-width:820px){.vzx-hide-sm{display:none!important}.vzx-hero-in{padding-top:32px;padding-bottom:48px;gap:32px}.vzx-section{padding-top:56px}.vzx-cta{padding:32px 24px}.workspace{padding:20px}}
@media (max-width:620px){.vzx-contact{grid-template-columns:1fr}.vzx-actions .btn,.vzx-form-actions .btn{flex:1 1 100%}.vzx-nav{gap:8px}.vzx-brand{font-size:15px}.vzx-cards{grid-template-columns:1fr}.vzx-panel,.vzx-fs{padding:20px}.vzx-stepper .lbl{font-size:12.5px}.vzx-review{grid-template-columns:1fr}.vzx-aside{position:static}.vzx-pricing{padding:20px}}

function showModal(title,body,footer='',wide=false){$('modal-root').innerHTML=`<div class="overlay" onclick="if(event.target===this)app.closeModal()"><div class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><div class="eyebrow" translate="no">${esc(serverMode()?club()?.name||'':'Volleyball Zone · ТУРШИЛТ')}</div><h3>${esc(title)}</h3></div><button class="btn icon-btn" aria-label="Хаах" onclick="app.closeModal()">${ico('x')}</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer||'<button class="btn outline" onclick="app.closeModal()">Close</button>'}</div></div></div>`}
const closeModal=()=>{$('modal-root').innerHTML=''};
function selectOptions(list,val){return list.map(([id,name])=>`<option value="${esc(id)}" ${id===val?'selected':''}>${esc(name)}</option>`).join('')}

function navItems(){const pend=isStaff()?vzVisibleApplications().filter(a=>a.status==='pending').length:0;let a=[['dashboard',ico('grid'),'Overview'],['schedule',ico('calendar'),'Class schedule'],['members',ico('users'),'Members']];if(['coach','owner','reception'].includes(ui.role))a.push(['attendance',ico('attendance'),'Attendance']);if(ui.role==='coach'||ui.role==='owner')a.push(['exercises',ico('chart'),'Exercise programs'],(serverMode()?['fees',ico('card'),'Төлбөр']:['payments',ico('card'),'Payments & bank']),['notifications',ico('bell'),'Notifications']);if(ui.role==='reception')a.push((serverMode()?['fees',ico('card'),'Төлбөр']:['payments',ico('card'),'Гар төлбөр']),['notifications',ico('bell'),'Notifications']);if(isStaff())a.splice(1,0,['applications',ico('inbox'),'Элсэлтийн хүсэлт',pend||'']);if(ui.role==='owner'){if(serverMode())a.push(['staff',ico('key'),'Ажилтнууд']);a.push(['settings',ico('settings'),'Club settings'])};if(ui.role==='student')a=[['dashboard',ico('grid'),'My dashboard'],['exercises',ico('chart'),'My exercises'],['members',ico('user'),'My profile']];if(ui.role==='platform')a=[['dashboard',ico('grid'),'Platform overview'],['clubs',ico('grid'),'Clubs & subscriptions'],['notifications',ico('bell'),'Demo activity']];return a;}
function render(){const root=$('app');if(ui.role==='setup'){root.innerHTML=setupPage()}else if(ui.role==='public'){root.innerHTML=publicPage()}else if(ui.role==='login'){root.innerHTML=loginPage()}else if(ui.role==='register'){root.innerHTML=registrationPage()}else if(ui.role==='regsuccess'){root.innerHTML=registrationSuccessPage()}else{root.innerHTML=shellPage()}if(ui.filter&&ui.view==='members'&&ui.role!=='student')filterMembers(ui.filter);}
function loginPage(){if(serverMode())return cloud.setupNeeded?setupPage():serverLoginPage();const roles=[['owner',ico('key',22),'Club owner','All members, billing, settings and payments'],['coach',ico('clipboard',22),'Coach','My classes, attendance and student exercises'],['reception',ico('inbox',22),'Receptionist','Register students and manage enrollments'],['student',ico('user',22),'Student','Complete exercises and view progress'],['platform',ico('globe',22),'Platform administrator','Manage clubs and SaaS subscriptions']];return `<div class="login-bg"><div class="login-card"><div class="login-top"><div class="brand"><img class="brand-logo" src="${VZ_LOGO}" alt="">VOLLEYBALL <b>ZONE</b></div><h2>Explore the working demo</h2><p style="margin-top:8px;color:#cbd4f5">Choose a role. No password or internet connection required.</p></div><div class="login-body"><div class="notice" style="margin-bottom:18px">Simulation only. Changes persist in this browser; bank email, SMS and refunds are not real.</div><div class="role-grid">${roles.map(([r,emo,name,desc])=>`<button class="role-card" onclick="app.login('${r}')"><span class="role-ico">${emo}</span><span><strong>${name}</strong><small>${desc}</small></span></button>`).join('')}</div><div class="between" style="margin-top:19px"><button class="btn outline sm" onclick="app.goPublic()">← Club homepage</button><button class="btn danger sm" onclick="app.resetDemo()">Reset demo data</button></div></div></div></div>`}
function shellPage(){const items=navItems();if(!items.some(x=>x[0]===ui.view))ui.view='dashboard';const name=({dashboard:'Overview',schedule:'Class schedule',members:'Members',attendance:'Attendance',exercises:'Exercises',payments:'Payments',notifications:'Notifications',settings:'Settings',clubs:'Clubs',staff:'Ажилтнууд',fees:'Төлбөр'}[ui.view]);return `<div class="app-shell ${ui.mobile?'mobile-open':''}"><div class="sidebar-backdrop" onclick="app.toggleMobile()"></div><aside class="sidebar"><div class="brand"><img class="brand-logo" src="${VZ_LOGO}" alt="">VOLLEYBALL <b>ZONE</b></div><div class="sidebar-label">WORKSPACE</div>${items.map(([id,icon,label,badge])=>`<button class="nav-item ${id===ui.view?'active':''}" ${id===ui.view?'aria-current="page"':''} onclick="app.changeView('${id}')"><span class="ni">${icon}</span>${esc(label)}${badge?`<span class="nav-badge" aria-label="${badge} шинэ">${badge}</span>`:''}</button>`).join('')}<div class="sidebar-bottom"><div class="tenant-box"><strong class="small">${esc(club().name)}</strong><div class="tiny" style="color:#a8b2d4;margin-top:5px">${ui.role==='platform'?'Multi-club admin':serverMode()?'Клубийн систем':'Local demo workspace'}</div></div><button class="nav-item" onclick="app.goPublic()"><span class="ni">${ico('home')}</span>Club public page</button>${serverMode()?`<button class="nav-item" onclick="app.openAccount()"><span class="ni">${ico('user')}</span>Миний бүртгэл</button><button class="nav-item" onclick="app.logout()"><span class="ni">${ico('back')}</span>Гарах</button>`:`<button class="nav-item" onclick="app.goLogin()"><span class="ni">${ico('swap')}</span>Switch role</button>`}<div class="profile-box"><span class="avatar sm">${esc(initials(userName()))}</span><span><p>${esc(userName())}</p><small>${esc(cloud.user?(VZ_ROLE_LABEL[cloud.user.role]||''):ui.role.toUpperCase()+' · Demo')}</small></span></div></div></aside><div class="app-main"><header class="app-toolbar"><div class="flex"><button class="circle-button mobile-menu" aria-label="Цэс нээх" onclick="app.toggleMobile()">${ico('menu',20)}</button><div class="crumb">${esc(club().name)} / <strong>${esc(name)}</strong></div></div><div class="toolbar-identity">${cloudPill()}<span class="avatar sm">${esc(initials(userName()))}</span><span class="small" style="font-weight:800">${esc(userName())}</span></div></header><main class="workspace">${renderScreen()}</main></div></div>`}
function head(eyebrow,title,description='',buttons=''){return `<div class="page-head"><div><div class="eyebrow">${esc(eyebrow)}</div><h2>${esc(title)}</h2>${description?`<p class="muted">${esc(description)}</p>`:''}</div><div class="head-actions">${buttons}</div></div>`}
const stat=(symbol,label,val,foot)=>`<div class="card stat-card"><div class="between"><div class="stat-label">${esc(label)}</div><div class="stat-icon">${statIcon(symbol)}</div></div><div class="stat-value">${esc(val)}</div><div class="stat-foot">${esc(foot)}</div></div>`;
function renderScreen(){switch(ui.view){case 'dashboard':return dashboard();case 'applications':return applicationsPage();case 'schedule':return schedule();case 'members':return membersPage();case 'attendance':return attendancePage();case 'exercises':return exercisePage();case 'payments':return ui.role==='reception'?manualPaymentsPage():((isOwner()?manualPaymentsPanel():'')+paymentsPage());case 'notifications':return notificationsPage();case 'settings':return settingsPage();case 'clubs':return clubsPage();case 'staff':return staffPage();case 'fees':return feesPage();default:return dashboard()}}
function dashboard(){if(isAdmin())return platformDashboard();if(ui.role==='student'){const m=memberOf(ui.studentId),tasks=data.tasks.filter(t=>t.memberId===m.id);return `${head('STUDENT PORTAL',`Hello, ${m.name}!`,'Your progress and training activities.')}<div class="stats-grid">${stat('📚','My exercises',tasks.length,'Assigned by your coach')}${stat('✅','Approved',tasks.filter(x=>x.status==='approved').length,'Coach confirmed')}${stat('🏃','My training',classOf(m.classId)?.name||'—','Your current class')}${stat('💡','Session balance',m.plan==='session'?m.remaining+' left':'Monthly','Membership model')}</div><div class="card" style="margin-top:20px"><div class="between"><h3>My pending exercises</h3><button class="btn sm primary" onclick="app.changeView('exercises')">View exercises</button></div>${tasks.filter(t=>t.status!=='approved').map(t=>`<div class="list-card"><span class="fancy-icon">📋</span><div><strong>${esc(programOf(t.programId)?.name)}</strong><p class="small muted">${esc(t.type)} · ${esc(t.status)}</p></div></div>`).join('')||'<div class="empty">You have completed all assigned exercises.</div>'}</div>`}
const ms=visibleMembers(),cs=visibleClasses(),paid=ms.reduce((a,x)=>a+x.paidTotal,0),owing=ms.reduce((a,x)=>a+x.outstanding,0),owingN=ms.filter(m=>m.outstanding>0).length,today=iso();
 const next=[];for(let i=0;i<7;i++){const d=plusDays(today,i);for(const c of cs){const s=getSession(c,d);if(s&&!s.cancelled)next.push(s)}}next.sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));const todayN=next.filter(s=>s.date===today).length;
 const warnAt=data.policies.sessionWarningAt??2,canPay=['owner','reception'].includes(ui.role),apps=vzVisibleApplications().filter(a=>a.status==='pending');

 const kpi=(l,v,f,warn=false)=>`<div class="vzx-kpi ${warn?'warn':''}"><span class="l">${l}</span><span class="v">${esc(v)}</span><span class="f">${f}</span></div>`;

 <div class="vzx-kpis">${kpi('Идэвхтэй гишүүд',ms.length,`${cs.length} ангид`)}${kpi('Ирэх 7 хоногийн хичээл',next.length,`Өнөөдөр ${todayN} хичээл`)}${kpi('Төлөгдөөгүй үлдэгдэл',money(owing),`${owingN} гишүүн`,owing>0)}${kpi('Нийт төлөгдсөн',money(paid),'Бүх хугацаанд')}</div>
 <div class="vzx-dash-grid"><section class="vzx-box vzx-att" aria-labelledby="vzx-att-t"><div class="vzx-box-head"><h2 id="vzx-att-t">Анхаарах гишүүд</h2><button class="vzx-link" onclick="app.changeView('members')">Бүгдийг харах</button></div>${attention.length?`<div class="vzx-table-wrap"><table class="vzx-table"><thead><tr><th scope="col">Гишүүн</th><th scope="col">Шалтгаан</th><th scope="col" class="r">Үйлдэл</th></tr></thead><tbody>${attention.map(m=>`<tr><td><span class="vzx-person"><span class="vzx-av">${esc(initials(m.name))}</span><span><strong>${esc(m.name)}</strong><small>${esc(vzShortName(classOf(m.classId)?.name||''))}</small></span></span></td><td>${m.outstanding>0?`<span class="vzx-badge bad">Төлөгдөөгүй ${money(m.outstanding)}</span>`:`<span class="vzx-badge warn">${m.remaining} хичээл үлдсэн</span>`}</td><td class="r"><span class="vzx-row-actions">${m.outstanding>0?`<button class="btn outline sm" onclick="app.remindMember('${m.id}')">Сануулах</button>`:''}${canPay&&m.outstanding>0?`<button class="btn soft sm" onclick="app.openManualPayment('${m.id}')">Төлбөр</button>`:`<button class="btn soft sm" onclick="app.memberDetail('${m.id}')">Дэлгэрэнгүй</button>`}</span></td></tr>`).join('')}</tbody></table></div>`:`<div class="vzx-empty">${ico('check')}<p>Бүх гишүүний төлбөр, багц хэвийн байна.</p></div>`}</section>
 <div class="vzx-side"><section class="vzx-box" aria-labelledby="vzx-up-t"><div class="vzx-box-head"><h2 id="vzx-up-t">Ойрын хичээлүүд</h2><button class="vzx-link" onclick="app.changeView('schedule')">Хуваарь</button></div><div class="vzx-sessions">${next.slice(0,5).map(s=>`<div class="vzx-sess ${s.date===today?'today':''}"><div class="when"><span>${dayLbl(s.date)}</span><strong>${esc(s.start)}</strong></div><div class="what"><strong>${esc(vzShortName(s.cls.name))}</strong><small>${esc(s.room)} · ${esc(coachOf(s.cls.coachId)?.name||'')} · ${enrolled(s.classId)} гишүүн</small></div>${s.date===today?`<button class="btn gold sm" onclick="app.openAttendance('${s.classId}','${s.date}')">Ирц</button>`:''}</div>`).join('')||`<div class="vzx-empty"><p>Ирэх 7 хоногт хичээл алга.</p></div>`}</div></section>
 <section class="vzx-box" aria-labelledby="vzx-app-t"><div class="vzx-box-head"><h2 id="vzx-app-t">Элсэлтийн хүсэлт</h2>${apps.length?`<button class="vzx-link" onclick="app.changeView('applications')">Бүгд (${apps.length})</button>`:''}</div>${apps.length?apps.slice(-3).reverse().map(a=>`<div class="vzx-sess"><div class="what"><strong>${esc(a.name)}</strong><small>${esc(vzLabel(a.type))} · ${esc(vzShortName(classOf(a.classId)?.name||''))}</small></div><button class="btn outline sm" onclick="app.openApplicationDetail('${esc(a.id)}')">Харах</button></div>`).join(''):`<div class="vzx-empty">${ico('check')}<p>Шийдвэрлэх хүсэлт алга. Нүүр хуудаснаас ирсэн шинэ хүсэлт энд гарна.</p></div>`}</section></div></div></div>`}
function platformDashboard(){let kids=members().filter(m=>m.age<18).length;const annual=club().billing==='annual';const amt=kids*5000*(annual?12:1);return `${head('PLATFORM ADMIN','ClubFlow · Platform overview','Prototype with one club; add more demo clubs under Clubs & subscriptions.',`<button class="btn primary" onclick="app.changeView('clubs')">Manage clubs →</button>`)}<div class="stats-grid">${stat('🏟','Clubs',data.clubs.length,'Independently managed demo tenants')}${stat('🧒','Billable children',kids,'Age under 18 (demo assumption)')}${stat('💳','Proposed SaaS billing',money(amt),annual?'Annual term':'Monthly term')}${stat('📌','Price per child','5,000 ₮','Per month, before any discounts')}</div><div class="card" style="margin-top:20px"><h3>Platform operations</h3><p class="muted">Club owners have their own workspace, coaches see only assigned classes, and the platform administrator manages club subscriptions. This is role simulation, not production authentication.</p><div class="divider"></div><button class="btn primary" onclick="app.login('owner')">Preview club-owner workspace →</button></div>`}
function weekdayName(d){return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d]}
function weekStart(offset=0){const d=new Date(iso()+'T12:00:00');const day=(d.getDay()+6)%7;d.setDate(d.getDate()-day+7*offset);return iso(d)}
function getSession(c,date){const key=c.id+'|'+date,ov=data.sessionOverrides[key]||{};const holiday=data.holidays.some(h=>h.date===date);if(!c.days.includes(dayNo(date))&&!ov.extra)return null;return {key,classId:c.id,cls:c,date,start:ov.start||c.start,end:ov.end||c.end,room:ov.room||c.room,cancelled:Boolean(holiday||ov.cancelled),reason:ov.reason||(holiday?'Club holiday':'')};}
function getWeekSessions(woff=0,cs=visibleClasses()){const start=weekStart(woff);const arr=[];for(let i=0;i<7;i++){const d=plusDays(start,i);for(const c of cs){let s=getSession(c,d);if(s)arr.push(s)}}return arr.sort((a,b)=>a.date.localeCompare(b.date)||a.start.localeCompare(b.start))}
function sessionCard(s,withAction=true){return `<div class="session-card ${s.cancelled?'cancelled':''}"><div class="accent"></div><div class="session-time">${esc(fmtDate(s.date))}<br><span class="muted">${esc(s.start)}–${esc(s.end)}</span></div><div class="session-info"><strong>${esc(s.cls.name)}</strong><div class="small muted">${esc(coachOf(s.cls.coachId)?.name)} · ${esc(s.room)}</div></div>${s.cancelled?tag('Cancelled','red'):tag('Scheduled','green')}${withAction?`<button class="btn outline sm" onclick="app.openSession('${s.classId}','${s.date}')">Details</button>`:''}</div>`}
function schedule(){const cs=visibleClasses(), week=weekStart(ui.weekOffset), sessions=getWeekSessions(ui.weekOffset,cs);return `${head('TRAINING CALENDAR','Class schedule','Recurring weekly schedules, holidays and one-time exceptions.',`${(isOwner()||isCoach())&&visibleClasses().length?'<button class="btn outline" onclick="app.openExtraSession()">+ Нэмэлт хичээл</button>':''}${isOwner()?`<button class="btn primary" onclick="app.openNewClass()">${ico('plus')} Анги нээх</button>`:''}`)}${classesCard()}<div class="card"><div class="between" style="margin-bottom:16px"><div><h3>Week of ${fmtDate(week)}</h3><p class="small muted">Click a class for cancellation and details.</p></div><div class="head-actions"><button class="btn outline sm" onclick="app.shiftWeek(-1)">← Previous</button><button class="btn outline sm" onclick="app.shiftWeek(0)">This week</button><button class="btn outline sm" onclick="app.shiftWeek(1)">Next →</button></div></div><div class="week-grid">${Array.from({length:7},(_,i)=>{const d=plusDays(week,i),s=sessions.filter(x=>x.date===d);return `<div class="day-col ${d===iso()?'today':''}"><div class="day-head"><span class="day-name">${weekdayName(dayNo(d))}</span><span class="day-num">${Number(d.slice(-2))}</span></div>${s.map(x=>`<div class="slot ${x.cancelled?'off':''}" onclick="app.openSession('${x.classId}','${x.date}')"><div class="slot-title">${esc(x.cls.name)}</div><div class="slot-time">${esc(x.start)}–${esc(x.end)}</div>${x.cancelled?'<div class="tiny" style="color:#ba4757;margin-top:4px">Cancelled</div>':''}</div>`).join('')||'<p class="tiny muted">No classes</p>'}</div>`}).join('')}</div></div><div class="grid-2" style="margin-top:18px"><div class="card"><h3>Weekly recurring classes</h3>${cs.map(c=>`<div class="list-card"><span class="fancy-icon">${c.sport==='Basketball'?'🏀':'🏐'}</span><div style="flex:1"><strong>${esc(c.name)}</strong><p class="small muted">${esc(c.days.map(weekdayName).join(' · '))}, ${esc(c.start)}–${esc(c.end)}</p><p class="tiny muted">Coach: ${esc(coachOf(c.coachId)?.name)}</p></div></div>`).join('')}</div><div class="card"><div class="between"><h3>No-class holidays</h3>${isOwner()?'<button class="btn outline sm" onclick="app.openHoliday()">+ Holiday</button>':''}</div>${data.holidays.map(h=>`<div class="keyval"><span>${fmtDate(h.date)}</span><span>${esc(h.name)}</span></div>`).join('')||'<p class="muted">No holidays configured.</p>'}<p class="small muted" style="margin-top:12px">Holidays suppress attendance and credit deductions without changing monthly billing.</p></div></div>`}
function openSession(cid,date){const c=classOf(cid),s=getSession(c,date);if(!s)return toast('Session not found');const can=canAccessClass(c),m=members().filter(x=>x.classId===c.id);showModal(`${c.name} · ${fmtDate(date)}`,`<div class="grid-2"><div><div class="keyval"><span>Time</span><span>${esc(s.start)}–${esc(s.end)}</span></div><div class="keyval"><span>Coach</span><span>${esc(coachOf(c.coachId)?.name)}</span></div><div class="keyval"><span>Location</span><span>${esc(s.room)}</span></div><div class="keyval"><span>Members</span><span>${m.length}</span></div><div class="keyval"><span>Status</span><span>${s.cancelled?'Cancelled':'Scheduled'}</span></div></div><div><p class="small muted">${s.cancelled?'This class is cancelled. No attendance or session credits are deducted.':'Coach can mark attendance for enrolled students.'}</p><div class="spacer"></div>${can&&isCoach()&&!s.cancelled?`<button class="btn primary full" onclick="app.openAttendance('${cid}','${date}')">Take attendance →</button>`:''}</div></div>${can&&!s.cancelled?`<div class="divider"></div><div class="field"><label>Reason (optional)</label><input id="cancel-reason" placeholder="Illness, unexpected closure..."></div><p class="hint" style="margin-top:9px">Cancellation requires a separate confirmation before simulated parent notifications are created.</p>`:''}`,`<button class="btn outline" onclick="app.closeModal()">Close</button>${can&&!s.cancelled?`<button class="btn outline" onclick="app.openReschedule('${cid}','${date}')">Reschedule</button><button class="btn danger" onclick="app.confirmCancel('${cid}','${date}')">Cancel class…</button>`:''}`)}
function confirmCancel(cid,date){const why=$('cancel-reason')?.value.trim()||'';pendingCancelReason=why;showModal('Confirm cancellation & send',`<div class="notice warn">You are cancelling <strong>${esc(classOf(cid)?.name)}</strong> on ${fmtDate(date)}. The system will mark it cancelled, exclude attendance and create simulated SMS/email messages to the registered payers. No real messages are sent.</div><div class="spacer"></div><p><strong>Reason:</strong> ${esc(why||'Not provided (optional)')}</p>`,`<button class="btn outline" onclick="app.openSession('${cid}','${date}')">Back</button><button class="btn danger" onclick="app.cancelSession('${cid}','${date}')">Confirm cancellation & send</button>`)}
function removeAttendanceForCancelledDay(cid,date){members().filter(m=>m.classId===cid).forEach(m=>{const k=attKey(cid,date,m.id);if(data.attendance[k]==='present'&&m.plan==='session'){m.remaining++;if(m.outstanding>0)m.unpaidUsed=Math.max(0,m.unpaidUsed-1)}delete data.attendance[k]})}
function cancelSession(cid,date){const reason=pendingCancelReason;pendingCancelReason='';const c=classOf(cid);if(!canAccessClass(c))return toast('You cannot cancel this class');const k=cid+'|'+date;data.sessionOverrides[k]={...(data.sessionOverrides[k]||{}),cancelled:true,reason};removeAttendanceForCancelledDay(cid,date);members().filter(m=>m.classId===cid).forEach(m=>notify(m.payerPhone,'Class cancelled',`${c.name} ангийн ${fmtDate(date)}-ны хичээл цуцлагдлаа. Дараагийн хичээлээ хуваариас шалгана уу.`));aud(`${userName()} ${c.name} ангийн ${date}-ны хичээлийг цуцалсан`);closeModal();action('Class cancelled; simulated notifications queued')}

function markAttendance(mid,status,override=false){const m=memberOf(mid),c=classOf(ui.attClass),s=getSession(c,ui.attDate);if(!m||!s||s.cancelled||m.classId!==c.id||!isCoach()||c.coachId!==ui.coachId)return toast('Attendance is restricted to the assigned coach and scheduled class');const key=attKey(c.id,ui.attDate,mid),old=data.attendance[key]||'not-marked';if(old===status)return toast('Already marked '+status);if(status==='present'&&old!=='present'&&m.plan==='session'){
 if(m.remaining<=0&&!override){return showModal('No prepaid sessions remaining',`<div class="notice warn">${esc(m.name)} has zero sessions available. Attendance can be recorded only as a documented coach exception. Payment remains due.</div>${field('attendance-reason','Reason for exception','Family contacted')}`,`<button class="btn outline" onclick="app.closeModal()">Cancel</button><button class="btn danger" onclick="app.attendanceOverride('${mid}','${status}')">Record exception</button>`)}
 if(m.outstanding>0&&m.unpaidUsed>=m.graceAllowance&&!override){return showModal('Unpaid-session limit reached',`<div class="notice warn">${esc(m.name)} has already attended ${m.unpaidUsed} unpaid sessions. The coach can make an exception, which will notify the club owner.</div>${field('attendance-reason','Reason (required)','Family requested an extension')}`,`<button class="btn outline" onclick="app.closeModal()">Cancel</button><button class="btn danger" onclick="app.attendanceOverride('${mid}','${status}')">Approve exception</button>`)}
 }
 if(old==='present'&&status!=='present'&&m.plan==='session'){m.remaining++;if(m.outstanding>0)m.unpaidUsed=Math.max(0,m.unpaidUsed-1)}
 if(status==='present'&&old!=='present'&&m.plan==='monthly'&&m.outstanding>0){const daysLate=Math.round((new Date(ui.attDate+'T12:00:00')-new Date(m.due+'T12:00:00'))/86400000);if(daysLate>data.policies.graceDays&&!override){return showModal('Monthly payment grace expired',`<div class="notice warn">${esc(m.name)} is past the ${data.policies.graceDays}-day payment grace period. The coach may intentionally record attendance with an exception, and the owner will be notified.</div>${field('attendance-reason','Reason for exception','Family contacted')}`,`<button class="btn outline" onclick="app.closeModal()">Cancel</button><button class="btn danger" onclick="app.attendanceOverride('${mid}','${status}')">Record exception</button>`)}}
 if(status==='present'&&old!=='present'&&m.plan==='session'){m.remaining--;if(m.outstanding>0)m.unpaidUsed++}
 data.attendance[key]=status;
 if(override&&m.outstanding){const msg=`Дасгалжуулагч ${coachOf(ui.coachId)?.name} ${m.name}-д онцгой зөвшөөрөл өглөө: ${data.lastExceptionReason||'Шалтгаангүй'}`;data.notifications.unshift({id:uid('nt'),date:iso(),channel:'Internal',to:'Club owner',type:'Grace exception',text:msg,status:'Simulated'});aud(msg);data.lastExceptionReason=''}
 aud(`${userName()} marked ${m.name} ${status} (${ui.attDate})`);closeModal();action('Attendance saved'+(m.plan==='session'?'; credit balance updated':''))}

function saveProgram(){let name=$('pname').value.trim(),items=$('pitems').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!name||!items.length)return toast('Enter a name and at least one exercise');data.programs.push({id:uid('p'),clubId:data.clubId,name,level:$('plevel').value,items});aud('Дасгалын хөтөлбөр үүсгэлээ: '+name);closeModal();action('New exercise model saved')}

function assignExercise(){const m=memberOf($('assign-student').value),c=classOf(m?.classId);if(!m||isCoach()&&c.coachId!==ui.coachId)return toast('Cannot assign outside your class');data.tasks.unshift({id:uid('task'),memberId:m.id,programId:$('assign-program').value,coachId:c.coachId,type:$('assign-type').value,status:'assigned',assignedAt:iso(),due:$('assign-due').value,markedBy:''});aud(`${m.name}-д дасгал даалгалаа`);closeModal();action('Exercise assigned')}
function completeExercise(tid,by){const t=data.tasks.find(x=>x.id===tid);if(!t||t.status!=='assigned')return;if(by==='student'&&(ui.role!=='student'||t.memberId!==ui.studentId))return toast('Only the student can submit this exercise');if(by==='coach'&&(!isCoach()||ui.coachId!==t.coachId))return toast('Only assigned coach may mark complete');t.status=by==='coach'?'approved':'pending';t.markedBy=by==='coach'?userName():'student';t.markedAt=iso();if(by==='coach')t.approvedBy=userName();aud(`${t.markedBy} marked exercise for ${memberOf(t.memberId)?.name}`);action(by==='coach'?'Exercise completed and auto-approved':'Submitted for coach approval')}
function approveExercise(tid){let t=data.tasks.find(x=>x.id===tid);if(!t||t.coachId!==ui.coachId||!isCoach()||t.status!=='pending')return;t.status='approved';t.approvedBy=userName();t.approvedAt=iso();aud(`${memberOf(t.memberId)?.name}-ийн дасгалыг баталлаа`);action('Exercise approved')}
function rejectExercise(tid){let t=data.tasks.find(x=>x.id===tid);if(!t||t.coachId!==ui.coachId||!isCoach()||t.status!=='pending')return;t.status='assigned';t.markedBy='';aud(`${memberOf(t.memberId)?.name}-д дасгалыг дахин хийхээр буцаалаа`);action('Exercise returned for another attempt')}
function paymentsPage(){if(!['coach','owner'].includes(ui.role))return head('PAYMENTS','Restricted','Payments are accessible to the club owner and assigned coaches.');const tx=data.transactions.filter(t=>t.clubId===data.clubId&&(!isCoach()||t.status==='unmatched'||t.allocations?.some(a=>visibleMembers().some(m=>m.id===a.memberId)))),un=tx.filter(t=>t.status==='unmatched'),owing=visibleMembers().reduce((n,m)=>n+m.outstanding,0);return `${head('BILLING & AUTOMATION','Payments & bank notifications','Bank email processing is simulated. Only new demo messages after connection are processed.',`${isOwner()?`<button class="btn outline" onclick="app.openBankConnection()">${data.bank.connected?'✉ Inbox settings':'✉ Connect email'}</button><button class="btn primary" onclick="app.openBankEmail()">+ Simulate new bank email</button>`:''}`)}<div class="stats-grid">${stat('💸','Visible outstanding',money(owing),'Assigned members')}${stat('🔍','Unmatched transactions',un.length,'Needs manual identification')}${stat('📬','Bank inbox',data.bank.connected?'Connected':'Not connected','Demo connection only')}${stat('✉','Transactions processed',tx.length,'All simulated events')}</div>${!data.bank.connected?'<div class="notice warn" style="margin-top:18px">Email inbox not connected. The owner can set up the simulated connection; old emails will not be scanned.</div>':`<div class="notice good" style="margin-top:18px">Туршилтын имэйл: ${esc(data.bank.inbox)} · Дараах цагаас хойш ирсэн имэйлийг л боловсруулна: ${new Date(data.bank.connectedAt).toLocaleString('en-GB',{hour12:false})}.</div>`}${isOwner()?`<div class="card" style="margin-top:18px"><div class="between"><div><h3>Quick testing</h3><p class="small muted">Click a scenario to simulate a completed incoming bank email.</p></div></div><div class="head-actions" style="margin-top:12px"><button class="btn outline sm" onclick="app.bankScenario('full')">Two children · Full 350,000 ₮</button><button class="btn outline sm" onclick="app.bankScenario('partial')">Two children · Partial 200,000 ₮</button><button class="btn outline sm" onclick="app.bankScenario('over')">Two children · Overpay 400,000 ₮</button><button class="btn outline sm" onclick="app.bankScenario('unmatched')">Unknown payer · Unmatched</button></div><p class="hint" style="margin-top:11px">Scenarios use current outstanding balances; reset demo to retest the original sample amounts.</p></div>`:''}<div class="grid-main" style="margin-top:18px"><div class="card"><div class="between"><h3>Bank transactions</h3>${tag('New emails only','blue')}</div><div class="table-scroll"><table class="data-table"><thead><tr><th>Received</th><th>Bank note / ref</th><th>Amount</th><th>Status</th><th>Action</th></tr></thead><tbody>${tx.slice().reverse().map(t=>`<tr><td>${fmtDate(t.date)}</td><td><strong>${esc(t.note)}</strong><div class="tiny muted">${esc(t.ref)}</div></td><td>${money(t.amount)}</td><td>${tag(t.status==='unmatched'?'Unmatched':t.status==='matched'?'Allocated':t.status,t.status==='unmatched'?'amber':'green')}</td><td>${t.status==='unmatched'?`<button class="btn primary xs" onclick="app.reviewTransaction('${t.id}')">Review</button>`:`<button class="table-action" onclick="app.viewTransaction('${t.id}')">Details</button>`}</td></tr>`).join('')||'<tr><td colspan="5" class="muted">No emails processed. Connect inbox and simulate a payment to test matching.</td></tr>'}</tbody></table></div></div><div class="stack"><div class="card"><h3>Allocation rules</h3><div class="keyval"><span>Full payment</span><span>Auto-mark paid</span></div><div class="keyval"><span>Multiple children</span><span>Match names + phone</span></div><div class="keyval"><span>Partial payment</span><span>Split equally, capped</span></div><div class="keyval"><span>Overpayment</span><span>Store payer credit</span></div><div class="keyval"><span>Unknown transaction</span><span>Keep unmatched</span></div><p class="hint" style="margin-top:12px">Emails alone cannot provide bank-grade payment confirmation; production would require trusted bank verification.</p></div><div class="card"><h3>Advance credits & refunds</h3>${Object.entries(data.payerCredits).filter(([ph,amt])=>amt>0).map(([ph,amt])=>`<div class="keyval"><span>${esc(ph)}</span><span>${money(amt)}</span></div>${isOwner()?`<button class="btn outline xs" onclick="app.requestRefund('${ph}')">Request demo refund</button>`:''}`).join('')||'<p class="small muted">No advance credits recorded.</p>'}${data.refunds.map(r=>`<div class="keyval"><span>${esc(r.phone)} · ${esc(r.status)}</span><span>${money(r.amount)}</span></div>${isOwner()&&r.status==='pending'?`<button class="btn sm success" onclick="app.approveRefund('${r.id}')">Mark refund completed</button>`:''}`).join('')}</div></div></div>`}
function openBankConnection(){if(!isOwner())return;showModal('Connect club owner email',`<div class="notice">This is a simulated connection. The demo does not request passwords, access Gmail, or read your real inbox.</div><div class="spacer"></div>${field('bank-email','Owner email address','owner@example.com','email')}<p class="hint" style="margin-top:10px">New demo transaction emails created after connection will be eligible for matching. Old emails will not be imported.</p>`,`<button class="btn outline" onclick="app.closeModal()">Cancel</button><button class="btn primary" onclick="app.connectBank()">Connect demo inbox</button>`)}
function connectBank(){const v=$('bank-email').value.trim();if(!/^\S+@\S+\.\S+$/.test(v))return toast('Enter a valid email address');data.bank={connected:true,connectedAt:Date.now(),inbox:v};club().bankInbox=v;aud('Demo bank notification inbox connected: '+v);closeModal();action('Demo inbox connected; no real email accessed')}
function openBankEmail(){if(!isOwner())return;showModal('Simulate incoming bank notification',`<div class="notice">Test payments only. A completed incoming transaction email is simulated; there is no bank or mailbox connection.</div><div class="spacer"></div><div class="form-grid">${field('bank-note','Transaction note','99112233 Бат Бата')}${field('bank-amount','Incoming amount (MNT)','200000','number','min="1"')}${field('bank-ref','Bank reference',uid('BANK'))}${choose('bank-status','Notification status',[['completed','Completed incoming payment'],['pending','Pending / not complete'],['outgoing','Outgoing transfer']])}</div>`,`<button class="btn outline" onclick="app.closeModal()">Cancel</button><button class="btn primary" onclick="app.bankSubmitForm()">Process demo email</button>`)}
function bankSubmitForm(){const note=$('bank-note').value.trim(),amount=Number($('bank-amount').value),ref=$('bank-ref').value.trim(),status=$('bank-status').value;if(!note||!ref||amount<=0)return toast('Enter note, positive amount and reference');closeModal();simulateBank(note,amount,ref,status)}
function bankScenario(type){if(!data.bank.connected)return toast('Connect the demo inbox first');const note=type==='unmatched'?'Тодорхойгүй шилжүүлэг 88000000':'99112233 Бат Бата';const amt=({full:350000,partial:200000,over:400000,unmatched:125000})[type];simulateBank(note,amt,uid('BANK'),'completed')}
function normalizeText(s){return String(s||'').normalize('NFKC').toLowerCase()}
function hasName(note,name){const s=normalizeText(note),n=normalizeText(name);if(!n)return false;const re=new RegExp('(^|[^\\p{L}\\p{N}])'+n.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=$|[^\\p{L}\\p{N}])','u');return re.test(s)}
function findPayers(note){const numeric=note.match(/\d[\d\s\-]{5,15}\d/g)||[];return numeric.map(n=>n.replace(/\D/g,'')).filter(n=>n.length>=6)}
function matchBank(note){const phones=findPayers(note);const candidates=members().filter(m=>[m.name,...(m.aliases||[])].some(n=>hasName(note,n)));const explicitPhone=phones.length>0;const named=candidates.filter(m=>!explicitPhone||phones.includes(m.payerPhone.replace(/\D/g,''))||phones.includes(m.phone.replace(/\D/g,'')));if(named.length===0)return [];
 // When multiple people share a short name, require extra payer-phone evidence.
 const seen=new Set();return named.filter(m=>!seen.has(m.id)&&seen.add(m.id))}
function simulateBank(note,amount,ref,status){if(!isOwner())return;if(!data.bank.connected)return toast('Connect the demo email inbox first');if(data.transactions.some(t=>t.clubId===data.clubId&&t.ref===ref))return toast('Duplicate bank reference ignored');if(status!=='completed')return toast('Not recorded: only completed incoming payment notifications are eligible');const tx={id:uid('tx'),clubId:data.clubId,ref,note,amount,date:iso(),createdAt:Date.now(),status:'unmatched',allocations:[],excess:0};data.transactions.push(tx);const matched=matchBank(note);if(matched.length){allocateTransaction(tx,matched,'Нэр болон утсаар автоматаар тохируулсан');}else{notify('Club owner','Unmatched payment',`${money(amount)} төлбөр, гүйлгээний дугаар ${ref}; утга: ${note}`,'Internal');notify('Assigned coaches','Unmatched payment needs review',`Гүйлгээний утгыг шалгана уу: ${note}`,'Internal');aud('Unmatched transaction '+ref)}action(matched.length?'Bank email simulated and allocated':'Bank email simulated; flagged unmatched')}
function splitEqual(amount,ms){const dues=ms.map(m=>Math.max(0,Number(m.outstanding)||0));const allocated=dues.map(()=>0);let left=Math.min(amount,dues.reduce((a,b)=>a+b,0));while(left>0){const open=dues.map((d,i)=>d-allocated[i]>0?i:-1).filter(i=>i!==-1);if(!open.length)break;const per=Math.floor(left/open.length),extra=left%open.length;let progress=0;open.forEach((idx,j)=>{const target=per+(j<extra?1:0),inc=Math.min(target,dues[idx]-allocated[idx]);allocated[idx]+=inc;left-=inc;progress+=inc});if(!progress)break}return allocated}
function allocateTransaction(tx,ms,source){if(!tx||tx.status!=='unmatched'||!ms.length)return;const alloc=splitEqual(tx.amount,ms);const used=alloc.reduce((a,b)=>a+b,0);ms.forEach((m,i)=>{const n=alloc[i];m.outstanding=Math.max(0,m.outstanding-n);m.paidTotal+=n;if(m.outstanding===0)m.unpaidUsed=0;tx.allocations.push({memberId:m.id,amount:n})});tx.excess=Math.max(0,tx.amount-used);tx.status='matched';tx.allocationMethod=source;const payerPhones=[...new Set(ms.map(m=>m.payerPhone))];if(tx.excess){if(payerPhones.length===1)data.payerCredits[payerPhones[0]]=(data.payerCredits[payerPhones[0]]||0)+tx.excess;else {tx.status='unmatched';tx.allocations.forEach(a=>{const m=memberOf(a.memberId);m.outstanding+=a.amount;m.paidTotal-=a.amount});tx.allocations=[];tx.excess=0;return toast('Cannot automatically place extra credit across different payers')}}
 const summaries=ms.map(m=>`${m.name}: ${money(tx.allocations.find(x=>x.memberId===m.id)?.amount||0)} төлөгдсөн; ${money(m.outstanding)} үлдсэн`).join('; ');payerPhones.forEach(ph=>notify(ph,'Payment confirmation',`Нийт ${money(tx.amount)} хүлээн авлаа. ${summaries}${tx.excess?`; ${money(tx.excess)} урьдчилгаа буюу буцааж авах боломжтой үлдэгдэл`:''}.`));aud(`${source}: ${tx.ref}; ${summaries}`)}
function viewTransaction(tid){let t=data.transactions.find(x=>x.id===tid);if(!t)return;showModal('Bank transaction details',`<div class="keyval"><span>Reference</span><span>${esc(t.ref)}</span></div><div class="keyval"><span>Amount</span><span>${money(t.amount)}</span></div><div class="keyval"><span>Transaction note</span><span>${esc(t.note)}</span></div><div class="keyval"><span>Status</span><span>${esc(t.status)}</span></div><div class="divider"></div><h4>Member allocation</h4>${t.allocations?.map(a=>`<div class="keyval"><span>${esc(memberOf(a.memberId)?.name)}</span><span>${money(a.amount)}</span></div>`).join('')||'Not allocated'}${t.excess?`<div class="keyval"><span>Payer advance credit</span><span>${money(t.excess)}</span></div>`:''}`)}
function reviewTransaction(tid){const t=data.transactions.find(t=>t.id===tid);if(!t||t.status!=='unmatched')return;const ms=isCoach()?visibleMembers():members();showModal('Resolve unmatched bank payment',`<div class="notice warn"><strong>${money(t.amount)}</strong> · ${esc(t.note)}<br>Reference: ${esc(t.ref)}</div><p class="small muted" style="margin:12px 0">Review the transaction note, contact the payer if necessary, and select the correct children. Partial payments split equally up to outstanding balances.</p><div class="stack" style="gap:6px;max-height:220px;overflow:auto">${ms.map(m=>`<label class="checkline"><input name="payment-members" type="checkbox" value="${esc(m.id)}"><span><strong>${esc(m.name)}</strong> · ${esc(m.payerPhone)} · ${money(m.outstanding)} due</span></label>`).join('')}</div><p class="hint" style="margin-top:12px">A coach may only allocate to members assigned to their classes; the club owner can allocate to anyone.</p>`,`<button class="btn outline" onclick="app.closeModal()">Cancel</button><button class="btn primary" onclick="app.assignPayment('${tid}')">Assign and confirm payment</button>`)}
function assignPayment(tid){let t=data.transactions.find(x=>x.id===tid),ids=[...document.querySelectorAll('input[name="payment-members"]:checked')].map(e=>e.value),ms=ids.map(memberOf).filter(Boolean);if(!t||!ms.length)return toast('Select at least one child');if(isCoach()&&ms.some(m=>classOf(m.classId)?.coachId!==ui.coachId))return toast('Cannot allocate to members outside your classes');const phones=[...new Set(ms.map(m=>m.payerPhone))];if(phones.length>1)return toast('Please allocate one payer household per transaction in this demo');allocateTransaction(t,ms,userName()+' manually assigned');closeModal();action('Unmatched payment assigned and recorded')}
function requestRefund(phone){const available=data.payerCredits[phone]||0;if(!isOwner()||available<=0)return;data.refunds.push({id:uid('refund'),phone,amount:available,date:iso(),status:'pending'});aud(`Refund requested for ${phone}: ${money(available)}`);action('Refund request recorded; not transferred')}
function approveRefund(id){const r=data.refunds.find(x=>x.id===id);if(!r||!isOwner()||r.status!=='pending')return;r.status='completed';data.payerCredits[r.phone]=Math.max(0,(data.payerCredits[r.phone]||0)-r.amount);notify(r.phone,'Refund status',`Клубийн эзэн ${money(r.amount)} буцаалтыг хийсэн гэж тэмдэглэлээ. Энэ демод бодит мөнгө шилжүүлээгүй.`);aud(`Эзэн ${money(r.amount)} буцаалтыг тэмдэглэсэн`);action('Refund marked completed (simulation)')}
function notify(to,type,text,channel=data.policies.channel){data.notifications.unshift({id:uid('nt'),date:iso(),createdAt:Date.now(),channel:channel==='email'?'Email':channel==='sms'?'SMS':channel,to,type,text,status:'Simulated'})}

const allowedNumbers=new Set(visibleMembers().map(m=>m.payerPhone));const filtered=isCoach()?data.notifications.filter(n=>allowedNumbers.has(n.to)||n.to==='Assigned coaches'):data.notifications;return `${head('COMMUNICATIONS','Notification center','Simulated SMS and email history. Phone calls are an optional future API connector.',`${isOwner()?'<button class="btn primary" onclick="app.runReminders()">▶ Run reminder rules</button>':''}`)}<div class="grid-main"><div class="card"><div class="between"><h3>Message history</h3>${tag(filtered.length+' entries','blue')}</div>${filtered.slice(0,50).map(n=>`<div class="list-card"><span class="fancy-icon">${n.channel==='SMS'?'💬':n.channel==='Email'?'✉️':'🔔'}</span><div style="flex:1"><div class="between"><strong>${esc(n.type)}</strong>${tag(n.channel,'purple')}</div><p class="small muted">To: ${esc(n.to)} · ${fmtDate(n.date)}</p><p class="small">${esc(n.text)}</p></div></div>`).join('')||'<div class="empty">No notifications.</div>'}</div><div class="card"><h3>Automatic reminder logic</h3><div class="keyval"><span>Monthly before due</span><span>Optional SMS/email</span></div><div class="keyval"><span>On due date</span><span>SMS/email now</span></div><div class="keyval"><span>Grace ends</span><span>Owner/coach alert</span></div><div class="keyval"><span>Session packages</span><span>Low-credit reminders</span></div><div class="keyval"><span>AI voice phone calls</span><span>Future API integration</span></div><div class="divider"></div><div class="notice">The Run reminder rules button simulates a scheduler check; no actual SMS, email, or call is sent. Payment reminders continue while a transaction is unmatched.</div></div></div>`}
function runReminders(){if(!isOwner())return;const today=iso(),p=data.policies;let count=0;members().forEach(m=>{if(m.plan==='monthly'&&m.outstanding>0){const days=Math.round((new Date(today+'T12:00:00')-new Date(m.due+'T12:00:00'))/86400000);if(days>=-p.earlyReminderDays){notify(m.payerPhone,'Membership payment reminder',`${m.name}: төлөх үлдэгдэл ${money(m.outstanding)}. Хугацаа: ${fmtDate(m.due)}.`);count++;if(days>p.graceDays){notify('Club owner','Monthly grace exceeded',`${m.name}-ийн төлбөрийн хөнгөлөлтийн хугацаа ${days-p.graceDays} хоногоор хэтэрсэн.`,'Internal')}}}else if(m.plan==='session'){if(m.remaining<=p.sessionWarningAt){notify(m.payerPhone,'Low sessions',`${m.name}-д ${m.remaining} хичээлийн эрх үлдсэн.`);count++}if(m.outstanding>0){notify(m.payerPhone,'Session package payment reminder',`${m.name}: ${money(m.outstanding)} төлөх үлдэгдэлтэй; төлбөргүй ${m.unpaidUsed} удаа ирсэн.`);count++}}});aud('Туршилтаар үүсгэсэн сануулгын тоо: '+count+' payer notifications');action(`Simulated ${count} reminder messages`)}
function settingsPageBase(){if(!isOwner())return '';const c=club(),p=data.policies;return `${head('CLUB CONFIGURATION','Club settings','Configure contact details, attendance and payment grace limits.')}<div class="grid-main"><div class="card"><h3>Club profile</h3><div class="form-grid" style="margin-top:14px">${field('club-name','Club name',c.name)}${field('club-phone','Club phone',c.phone)}${field('club-support','Support number',c.support)}${field('club-email','Contact email',c.email,'email')}${field('club-location','Location',c.location)}${field('club-activities','Activities',c.activities)}${field('club-tagline','Tagline',c.tagline)}</div><div class="spacer"></div><button class="btn primary" onclick="app.saveSettings()">Save club profile</button></div><div class="stack"><div class="card"><h3>Payment & grace rules</h3><div class="form-grid" style="margin-top:12px">${field('p-grace','Monthly grace days',p.graceDays,'number','min="0" max="365"')}${field('p-unpaid','Max unpaid sessions',p.maxUnpaidSessions,'number','min="0" max="30"')}${field('p-low','Low-session reminder threshold',p.sessionWarningAt,'number','min="0" max="30"')}${field('p-early','Early reminder (days)',p.earlyReminderDays,'number','min="0" max="30"')}${choose('p-channel','Default notification channel',[['sms','SMS'],['email','Email']],p.channel)}</div><div class="spacer"></div><button class="btn primary" onclick="app.saveSettings()">Save policies</button></div><div class="card"><h3>Integrations</h3><div class="keyval"><span>Bank email feed</span><span>${data.bank.connected?'Connected demo':'Not connected'}</span></div><div class="keyval"><span>SMS and email</span><span>Simulated</span></div><div class="keyval"><span>AI phone calls</span><span>API-ready, not implemented</span></div><div class="divider"></div><button class="btn outline sm" onclick="app.resetDemo()">Reset all dummy data</button></div></div></div>`}
function saveSettings(){if(!isOwner())return;const c=club(),p=data.policies;const numeric=[['p-grace','graceDays'],['p-unpaid','maxUnpaidSessions'],['p-low','sessionWarningAt'],['p-early','earlyReminderDays']];for(const [id,k] of numeric){const n=Number($(id).value);if(!Number.isInteger(n)||n<0||n>365)return toast('Policy limits must be valid non-negative integers');p[k]=n}c.name=$('club-name').value.trim()||c.name;c.phone=$('club-phone').value;c.support=$('club-support').value;c.email=$('club-email').value;c.location=$('club-location').value;c.activities=$('club-activities').value;c.tagline=$('club-tagline').value;p.channel=$('p-channel').value;members().forEach(m=>m.graceAllowance=Math.min(m.graceAllowance,p.maxUnpaidSessions));aud('Клубийн тохиргоо шинэчлэгдсэн');action('Club settings saved')}
function clubsPage(){if(!isAdmin())return '';const billingCost=c=>data.members.filter(m=>m.clubId===c.id&&m.active&&m.age<18).length*5000*(c.billing==='annual'?12:1);return `${head('SAAS ADMINISTRATION','Clubs & subscriptions','Monthly or annual plans, priced at a proposed 5,000 MNT per child per month.',`<button class="btn primary" onclick="app.openNewClub()">+ Add demo club</button>`)}<div class="card"><div class="table-scroll"><table class="data-table"><thead><tr><th>Club</th><th>Children</th><th>Subscription</th><th>Proposed invoice</th><th>Status</th><th>Action</th></tr></thead><tbody>${data.clubs.map(c=>`<tr><td><strong>${esc(c.name)}</strong><div class="tiny muted">${esc(c.location)}</div></td><td>${data.members.filter(m=>m.clubId===c.id&&m.active&&m.age<18).length}</td><td>${tag(c.billing==='annual'?'Annual':'Monthly','blue')}</td><td>${money(billingCost(c))}</td><td>${tag(c.status,'green')}</td><td><button class="btn outline sm" onclick="app.toggleBilling('${c.id}')">Switch billing</button></td></tr>`).join('')}</tbody></table></div><div class="notice" style="margin-top:15px">Billing rates and the child-age definition are demo assumptions; no invoices or real payments are generated. New clubs are isolated records, but role login is simulated—not real access control.</div></div>`}
function toggleBilling(cid){if(!isAdmin())return;const c=data.clubs.find(c=>c.id===cid);if(!c)return;c.billing=c.billing==='monthly'?'annual':'monthly';aud(`${c.name} subscription switched to ${c.billing}`);action('Subscription term updated')}

function vzClassCards(opts,sel){return `<input type="hidden" id="vz-class" value="${esc(sel||'')}"><div class="vzx-classpick" role="radiogroup" aria-label="Анги сонгох">${opts.map(c=>`<label class="vzx-classopt"><input type="radio" name="vz-class-r" value="${esc(c.id)}" ${c.id===sel?'checked':''} onchange="app.pickRegClass(this.value)"><span><strong>${esc(vzShortName(c.name))}</strong><small>${vzDaysSorted(c.days).map(d=>VZ_DAY_SHORT[d]).join(', ')} · ${esc(c.start)}–${esc(c.end)} · ${esc(coachOf(c.coachId)?.name||'')}</small></span></label>`).join('')}</div>`}

 if(ui.regStep===3){const c=classOf(d.classId),slots=vzMeetingSlots(c);content=`<form id="vz-meeting-form" class="vzx-form" onsubmit="event.preventDefault();app.submitRegistration()"><fieldset class="vzx-fs"><legend>Танилцах уулзалтын цагаа сонгоно уу</legend><p class="vzx-fs-desc">${esc(vzShortName(c?.name||''))} ангид элсэхийн өмнө клуб дээр ирж, дасгалжуулагчтай уулзах өдрөө товлоорой.</p><div class="vz-slots">${slots.map((s,i)=>`<label class="vz-slot"><input type="radio" name="meeting" value="${s.date}|${s.time}" ${i===0?'checked':''} required><span><strong>${vzD(s.date)}</strong><small>${esc(s.time)} · Бэлтгэлийн өмнөх уулзалт</small></span></label>`).join('')}</div>${slots.length?'':`<div class="notice warn">Ойрын өдрүүдэд сонгосон ангийн цаг алга. Өөр анги сонгоно уу.</div>`}</fieldset>

function vzMeetingSlots(c){if(!c)return [];const today=new Date(),result=[];for(let i=0;i<45&&result.length<6;i++){const day=plusDays(iso(),i);if(!c.days.includes(dayNo(day)))continue;const s=getSession(c,day);if(!s||s.cancelled)continue;const [hh,mm]=c.start.split(':').map(Number),total=hh*60+mm-30;const meetTime=String(Math.floor(total/60)).padStart(2,'0')+':'+String(total%60).padStart(2,'0');const when=new Date(day+'T'+meetTime+':00');if(when.getTime()<today.getTime()+3*3600000)continue;result.push({date:day,time:meetTime})}return result}

// ===== Google Sheets өгөгдлийн сан + Gmail банкны төлбөр =====
// Нийтийн хуудаснаас (эцэг эхчүүд) хүсэлт клуб руу очихын тулд Apps Script Web App хаягийг энд буулгана:
const VZ_CLOUD_URL='';
const CLOUD_KEY='vz_cloud_v1';
const cloud={url:VZ_CLOUD_URL,token:'',rev:null,appsRev:null,ready:false,busy:false,lastSync:0,error:''};
try{const c=JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}');if(c.url)cloud.url=c.url;if(c.token)cloud.token=c.token}catch(e){}
function cloudSaveCfg(){try{localStorage.setItem(CLOUD_KEY,JSON.stringify({url:cloud.url,token:cloud.token}))}catch(e){}}
function cloudHasUrl(){return /^(https:\/\/[^\s]+|http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/[^\s]*|\/[^\s]*)$/.test(cloud.url||'')}
function cloudStaff(){return cloudHasUrl()&&!!cloud.token}
async function cloudReq(action,params={},post=false){let res;try{if(post){res=await fetch(cloud.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token:cloud.token||undefined,...params})})}else{const q=new URLSearchParams({action,...params});if(cloud.token)q.set('token',cloud.token);res=await fetch(cloud.url+'?'+q.toString())}}catch(e){throw new Error('Интернэт эсвэл серверт холбогдож чадсангүй')}if(!res.ok)throw new Error('Сервер алдаа буцаалаа ('+res.status+')');let j;try{j=await res.json()}catch(e){throw new Error('Серверийн хариу буруу байна. Web App хаягаа шалгана уу.')}if(j.auth&&serverMode()){cloud.token='';cloud.user=null;cloud.ready=false;cloudSaveCfg();ui.role='login';render()}if(!j.ok&&!j.conflict)throw new Error(j.error||'Үл мэдэгдэх алдаа');return j}
function cloudFail(e){cloud.error=String(e&&e.message||e);updateCloudPill();console.warn('Cloud:',cloud.error)}
function cloudPill(){if(!cloudStaff())return '<span class="vzx-demo-pill" id="vzx-cloud-pill">Туршилтын горим</span>';return cloud.error?`<span class="vzx-demo-pill bad" id="vzx-cloud-pill" title="${esc(cloud.error)}">Холболтын алдаа</span>`:`<span class="vzx-cloud-pill" id="vzx-cloud-pill">${cloud.server==='vz'?'Онлайн':'Google Sheets'}</span>`}
function updateCloudPill(){const el=$('vzx-cloud-pill');if(el)el.outerHTML=cloudPill()}
function mergeApps(list){let added=0;data.applications||=[];for(const a of list||[]){if(a&&!data.applications.some(x=>x.id===a.id)){data.applications.push(a);added++}}return added}
function cloudAdopt(j){cloud.server=j.server||cloud.server||'';if(j.mail)cloud.mail=j.mail;if(j.state&&j.state.version===3){data=j.state;data.applications||=[];data.manualPayments||=[];data.transactions||=[];data.payerCredits||={};localSet()}cloud.rev=j.rev;cloud.appsRev=j.appsRev}
async function cloudLoad(){const j=await cloudReq('load');const empty=!(j.state&&j.state.version===3);cloudAdopt(j);cloud.ready=true;if(empty)await cloudSave();cloud.lastSync=Date.now();cloud.error='';const n=await importBankRows(j.inbox||[]);if(!n)render();return j}
let cloudTimer=null;
function cloudQueueSave(){if(!cloudStaff()||!cloud.ready)return;clearTimeout(cloudTimer);cloudTimer=setTimeout(()=>cloudSave().catch(cloudFail),600)}
async function cloudSave(){const j=await cloudReq('save',{state:data,baseRev:cloud.rev},true);if(j.conflict){cloudAdopt(j);render();toast('Өөр төхөөрөмж дээр өөрчлөлт орсон тул хамгийн сүүлийн мэдээллийг ачааллаа. Сүүлийн үйлдлээ дахин хийнэ үү.');return}cloud.rev=j.rev;cloud.appsRev=j.appsRev;if(mergeApps(j.applications))localSet();cloud.lastSync=Date.now();cloud.error='';updateCloudPill()}
async function cloudPoll(){if(!cloudStaff()||!cloud.ready||cloud.busy||document.hidden)return;cloud.busy=true;try{const j=await cloudReq('poll');if(j.rev!==cloud.rev){await cloudLoad();return}const added=mergeApps(j.applications);cloud.appsRev=j.appsRev;if(j.mail)cloud.mail=j.mail;const n=await importBankRows(j.inbox||[]);if(added&&!n){localSet();render();toast(`Шинэ элсэлтийн хүсэлт: ${added}`)}cloud.lastSync=Date.now();cloud.error='';updateCloudPill()}catch(e){cloudFail(e)}finally{cloud.busy=false}}
setInterval(cloudPoll,60000);
function vzMatchByCode(note){const codes=(String(note||'').toUpperCase().match(/VZ-\d{6}-\d{3}/g)||[]);if(!codes.length)return [];return members().filter(m=>m.sourceAppId&&codes.includes(String(m.sourceAppId).toUpperCase()))}
async function importBankRows(rows,markCloud=true){const fresh=(rows||[]).filter(r=>['new','review'].includes(r.status)&&r.ref&&Number(r.amount)>0);if(!fresh.length)return 0;let auto=0,review=0;const done=[];for(const r of fresh){done.push(r.ref);if(data.transactions.some(t=>t.clubId===data.clubId&&t.ref===r.ref))continue;const note=String(r.note||'');const tx={id:uid('tx'),clubId:data.clubId,ref:r.ref,note,amount:Number(r.amount),date:String(r.date||'').slice(0,10)||iso(),createdAt:Date.now(),status:'unmatched',allocations:[],excess:0,bank:r.bank||'',payerName:r.fromName||'',payerAccount:r.fromAccount||'',source:'gmail'};data.transactions.push(tx);const matched=r.status==='new'?(vzMatchByCode(note).length?vzMatchByCode(note):matchBank(note)):[];if(matched.length){allocateTransaction(tx,matched,'Банкны мэйлээс автоматаар тохируулсан')}if(tx.status==='matched'){auto++}else{review++;notify('Club owner','Unmatched payment',`${r.bank||'Банк'}: ${money(tx.amount)}, утга: ${note||'—'}. Гараар шалгана уу.`,'Internal');aud(`Банкны мэйлийн гүйлгээ шалгах шаардлагатай: ${r.ref}`)}}data.bank.connected=true;store();render();if(auto||review)toast(`Банкнаас ${auto+review} шинэ гүйлгээ: ${auto} автоматаар бүртгэгдсэн${review?`, ${review} шалгах шаардлагатай`:''}`);if(markCloud&&cloudStaff()){try{await cloudReq('markInbox',{refs:done,status:'imported'},true)}catch(e){cloudFail(e)}}return auto+review}
function applyPublicInfo(p){if(!p)return;data.clubId=p.clubId||data.clubId;if(Array.isArray(p.clubs)&&p.clubs.length)data.clubs=p.clubs.map(c=>({...(data.clubs.find(x=>x.id===c.id)||{}),...c}));if(Array.isArray(p.classes))data.classes=p.classes;if(Array.isArray(p.coaches))data.coaches=p.coaches;data.holidays=p.holidays||[];data.sessionOverrides=p.sessionOverrides||{};data.pricing=p.pricing||null}
async function vzBootLegacy(){if(cloudStaff()){render();try{await cloudLoad()}catch(e){cloudFail(e);render()}return}if(cloudHasUrl()){try{const j=await cloudReq('public');applyPublicInfo(j.public)}catch(e){console.warn(e)}}store();render()}
async function submitRegistration(){if(!cloudHasUrl()||cloudStaff())return submitRegistrationLocal();const before=data.applications.length;submitRegistrationLocal();if(ui.role!=='regsuccess'||data.applications.length===before)return;const a=data.applications.find(x=>x.id===registrationReceipt);if(!a)return;try{const j=await cloudReq('apply',{application:a},true);if(j.id&&j.id!==a.id){a.id=j.id;registrationReceipt=j.id;localSet();render()}toast('Хүсэлт клубт амжилттай илгээгдлээ.')}catch(e){data.applications=data.applications.filter(x=>x!==a);localSet();ui.role='register';ui.regStep=3;render();toast('Хүсэлт илгээж чадсангүй: '+e.message+'. Дахин оролдоно уу.')}}
async function lookupApplication(){if(!cloudHasUrl()||cloudStaff())return lookupApplicationLocal();const id=($('vz-lookup-id')?.value||'').trim().toUpperCase(),phone=vzDigits($('vz-lookup-phone')?.value);try{const j=await cloudReq('status',{id,phone});if(j.application){const i=data.applications.findIndex(x=>x.id===j.application.id);if(i>=0)data.applications[i]={...data.applications[i],...j.application};else data.applications.push(j.application);localSet()}}catch(e){return toast('Клубийн системтэй холбогдож чадсангүй: '+e.message)}lookupApplicationLocal()}
function settingsPage(){if(!isOwner())return '';return settingsPageBase()+(serverMode()?(cloud.user&&cloud.ready?serverGmailCard()+accountCard():''):gmailCard()+cloudCard())}
function cloudCard(){const on=cloudStaff();return `<section class="card vzx-cloud" aria-labelledby="vzx-cloud-t"><div class="between"><div><h3 id="vzx-cloud-t">Сервер холболт</h3><p class="muted small">Мэдээллийг танай сервер (эсвэл Google Sheet) дээр хадгалж, бүх ажилтан ижил мэдээлэл харна.</p></div>${on?(cloud.error?tag('Алдаатай','red'):tag('Холбогдсон','green')):tag('Холбогдоогүй','amber')}</div><div class="form-grid" style="margin-top:16px">${field('cloud-url','Серверийн хаяг',cloud.url,'text','placeholder="/api эсвэл https://…" autocomplete="off" spellcheck="false"')}${field('cloud-token','API түлхүүр',cloud.token,'password','autocomplete="off"')}</div>${cloud.error?`<div class="notice bad" style="margin-top:12px">${esc(cloud.error)}</div>`:''}<p class="small muted" style="margin-top:12px">${on?`Сүүлд шинэчилсэн: ${cloud.lastSync?esc(new Date(cloud.lastSync).toLocaleString()):'—'}`:'Анх холбоход сервер хоосон бол энэ төхөөрөмжийн мэдээллийг хуулна. Серверт мэдээлэл байвал түүгээр энэ төхөөрөмжийн мэдээллийг солино.'}</p><div class="vzx-actions" style="margin-top:16px"><button class="btn primary" onclick="app.cloudConnect()">${on?'Хадгалах ба дахин ачаалах':'Холбох'}</button>${on?`<button class="btn outline" onclick="app.cloudScanNow()">Банкны мэйл одоо шалгах</button><button class="btn outline" onclick="app.cloudDisconnect()">Салгах</button>`:''}</div></section>`}
async function cloudConnect(){const url=($('cloud-url')?.value||'').trim(),token=($('cloud-token')?.value||'').trim();cloud.url=url;cloud.token=token;if(!cloudHasUrl())return toast('Серверийн хаяг /api эсвэл https://… хэлбэртэй байна.');if(!token)return toast('API түлхүүрээ оруулна уу.');cloud.ready=false;try{await cloudReq('ping');cloudSaveCfg();await cloudLoad();toast(cloud.server==='vz'?'Сервертэй холбогдлоо.':'Google Sheets-тэй холбогдлоо.')}catch(e){cloudFail(e);toast('Холбогдож чадсангүй: '+cloud.error)}render()}
async function cloudScanNow(){if(!cloudStaff())return;toast('Банкны мэйл шалгаж байна…');try{const j=await cloudReq('scanNow',{},true);if(j.mail)cloud.mail=j.mail;const n=await importBankRows(j.inbox||[]);if(!n){render();toast(j.mail&&j.mail.error?j.mail.error:'Шинэ гүйлгээ олдсонгүй.')}}catch(e){cloudFail(e);toast('Шалгаж чадсангүй: '+cloud.error)}}
function cloudDisconnect(){if(!confirm('Энэ төхөөрөмжийг Google Sheets-ээс салгах уу? Sheet дэх мэдээлэл хэвээр үлдэнэ.'))return;cloud.token='';cloud.ready=false;cloud.error='';cloudSaveCfg();render();toast('Салгалаа.')}

const GMAIL_KEY='vz_gmail_v1';
const gmail={clientId:VZ_GOOGLE_CLIENT_ID,token:'',exp:0,email:'',busy:false,lastScan:0,error:''};
try{const c=JSON.parse(localStorage.getItem(GMAIL_KEY)||'{}');if(c.clientId)gmail.clientId=c.clientId;if(c.email)gmail.email=c.email}catch(e){}
try{const t=JSON.parse(sessionStorage.getItem(GMAIL_KEY)||'{}');if(t.token&&t.exp>Date.now()){gmail.token=t.token;gmail.exp=t.exp}}catch(e){}
function gmailSaveCfg(){try{localStorage.setItem(GMAIL_KEY,JSON.stringify({clientId:gmail.clientId,email:gmail.email}));sessionStorage.setItem(GMAIL_KEY,JSON.stringify({token:gmail.token,exp:gmail.exp}))}catch(e){}}
function gmailOn(){return !!gmail.token&&gmail.exp>Date.now()+30000}
function clubAccounts(){return String(club().bankAccounts||'').split(/[,;\s]+/).filter(Boolean)}
function vzAcctKey(s){let d=String(s||'').replace(/\D/g,'');if(d.length>=18)d=d.slice(-12);return d.replace(/^0+/,'')}
function vzIsClubAcct(a){const k=vzAcctKey(a);return !!k&&k.length>=6&&clubAccounts().some(c=>vzAcctKey(c)===k)}
function vzBankFor(from){const m=String(from||'').toLowerCase().match(/@([a-z0-9.-]+)/);if(!m)return null;return VZ_BANKS.find(b=>b.domains.some(d=>m[1]===d||m[1].endsWith('.'+d)))||null}
function vzDkimOk(lines,domains){return (lines||[]).some(l=>{const re=/dkim=pass[^;]*?header\.(?:d|i)=@?([a-z0-9.-]+)/ig;let m;while((m=re.exec(String(l)))){const d=m[1].toLowerCase();if(domains.some(x=>d===x||d.endsWith('.'+x)))return true}return false})}
function vzHtmlCells(html){const t=String(html||'').replace(/<!--[\s\S]*?-->/g,' ').replace(/<(style|script|head)[\s\S]*?<\/\1>/gi,' ').replace(/<\/?(td|th|tr|table|tbody|thead|p|div|br|li|h\d)\b[^>]*>/gi,'\u0001').replace(/<[^>]+>/g,'').replace(/&nbsp;/g,' ').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&#(\d+);/g,(m,n)=>String.fromCharCode(Number(n)));return t.split('\u0001').map(x=>x.replace(/\s+/g,' ').trim()).filter(Boolean)}
const VZ_AMOUNT_RE=/^-?[\d\s,]+\.\d{2}$/;
const vzNum=s=>Number(String(s||'').replace(/[\s,]/g,''))||0;
function vzParseKhan(cells){const joined=cells.join(' | ');if(!/Transaction (information|receipt)|Шилжүүлгийн мэдээлэл/i.test(joined))return null;const iFrom=cells.findIndex(c=>/^Дт\s*\/\s*From$/i.test(c)),iTo=cells.findIndex(c=>/^[KК]т\s*\/\s*To$/i.test(c));if(iFrom<0||iTo<0)return null;const iAmt=cells.findIndex((c,i)=>i>iFrom&&i<iTo&&VZ_AMOUNT_RE.test(c));if(iAmt<2)return null;const iName=cells.findIndex((c,i)=>i>iTo&&/^Нэр\s*\/\s*Name$/i.test(c));const iDesc=cells.findIndex(c=>/Transaction description/i.test(c));const date=(joined.match(/Огноо\s*\/\s*Date\s*:\s*(\d{4}\.\d{2}\.\d{2}\s+\d{2}:\d{2}(?::\d{2})?)/i)||[])[1]||'';const tx={date:date.replace(/\./g,'-'),journal:(joined.match(/Journal No\s*:\s*(\d+)/i)||[])[1]||'',amount:vzNum(cells[iAmt]),currency:cells[iAmt+1]||'MNT',fromAccount:cells[iAmt-2],fromName:cells[iAmt-1],toAccount:iName>0?cells[iName+1]:'',note:iDesc>=0?(cells[iDesc+1]||''):''};if(/^(Харилцагч танд|Гүйлгээний баримтыг)/.test(tx.note))tx.note='';tx.confident=!!(tx.amount>0&&tx.toAccount&&tx.currency==='MNT');return tx}
function vzParseGeneric(cells){const t=cells.join(' | ');const after=re=>{const i=cells.findIndex(c=>re.test(c));if(i<0)return '';const inl=cells[i].replace(re,'').replace(/^[\s:：\/-]+/,'').trim();return inl||cells[i+1]||''};let amount=0;const a=after(/(Гүйлгээний дүн|Орлогын дүн|Шилжүүлсэн дүн|Дүн|Amount)\s*[:：]?/i);if(a)amount=vzNum((a.match(/[\d\s,]+(?:\.\d{1,2})?/)||[])[0]);if(!amount){const m=t.match(/([\d,]+\.\d{2})\s*(MNT|₮|төг)/i);if(m)amount=vzNum(m[1])}if(!amount)return null;const note=after(/(Гүйлгээний утга|Утга|Transaction description|Description|Тайлбар)\s*[:：]?/i);const journal=((t.match(/(Журнал(?:ын)?(?:\s*дугаар)?|Journal No|Гүйлгээний дугаар|Reference(?: No)?|Ref\.?\s*No)\s*[:：]?\s*\|?\s*([A-Z0-9-]{4,})/i)||[])[2])||'';const toAccount=(t.match(/\b(?:MN\d{18}|\d{9,12})\b/g)||[]).find(vzIsClubAcct)||'';return {date:'',journal,amount,currency:'MNT',fromAccount:'',fromName:'',toAccount,note,confident:false}}
function vzB64(s){const bin=atob(String(s||'').replace(/-/g,'+').replace(/_/g,'/'));return new TextDecoder('utf-8').decode(Uint8Array.from(bin,c=>c.charCodeAt(0)))}
function vzMsgBody(p){let html='',text='';(function walk(x){if(!x)return;if(x.mimeType==='text/html'&&x.body?.data&&!html)html=vzB64(x.body.data);else if(x.mimeType==='text/plain'&&x.body?.data&&!text)text=vzB64(x.body.data);(x.parts||[]).forEach(walk)})(p);return html||esc(text).replace(/\n/g,'<br>')}
function vzBankRowFromGmail(msg){const H={};(msg.payload?.headers||[]).forEach(h=>{(H[h.name.toLowerCase()]||=[]).push(h.value)});const bank=vzBankFor((H.from||[''])[0]);if(!bank)return null;const cells=vzHtmlCells(vzMsgBody(msg.payload));const tx=(bank.parser==='khan'&&vzParseKhan(cells))||vzParseGeneric(cells);if(!tx||!tx.amount||!vzIsClubAcct(tx.toAccount))return null;const dk=vzDkimOk([...(H['authentication-results']||[]),...(H['arc-authentication-results']||[])],bank.domains);return {ref:bank.id+'-'+(tx.journal||msg.id),bank:bank.name,amount:tx.amount,note:(dk?'':'[Баталгаагүй мэйл] ')+(tx.note||''),fromName:tx.fromName||'',fromAccount:tx.fromAccount||'',date:tx.date||'',status:dk&&tx.confident?'new':'review'}}
async function gapi(path,params={}){const q=new URLSearchParams(params).toString();let r;try{r=await fetch('https://gmail.googleapis.com/gmail/v1/users/me/'+path+(q?'?'+q:''),{headers:{Authorization:'Bearer '+gmail.token}})}catch(e){throw new Error('Gmail-тэй холбогдож чадсангүй. Интернэтээ шалгана уу.')}if(r.status===401){gmail.token='';gmail.exp=0;gmailSaveCfg();throw new Error('Gmail-ийн нэвтрэлтийн хугацаа дууссан. "Gmail холбох" товчийг дахин дарна уу.')}if(!r.ok)throw new Error('Gmail алдаа буцаалаа ('+r.status+')');return r.json()}
function loadGis(){return new Promise((res,rej)=>{if(window.google?.accounts?.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>rej(new Error('Google нэвтрэлтийн скрипт ачаалагдсангүй'));document.head.appendChild(s)})}
